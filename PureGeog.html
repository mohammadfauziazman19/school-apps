ng-term community resilience is unproven. Conclusion: I partially agree -- Punggol's integrated approach is more holistic, but dismissing Toa Payoh overlooks the sustainability value of density and ongoing improvement through retrofitting. (L3)", "lo": true}]}, {"id": "P6", "title": "Microclimate — Wind Speed and Humidity, Bishan-Ang Mo Kio Park", "fieldwork": "A group of Secondary Four students conducted a microclimate fieldwork investigation in Bishan-Ang Mo", "intro": "A group of Secondary Four students conducted a microclimate fieldwork investigation in Bishan-Ang Mo Kio Park to examine how the presence of dense tree canopy and the naturalised river affects wind speed and humidity conditions at different locations within the park. They were interested in understa", "questions": [{"id": "P6a", "ao": "AO1", "marks": 1, "cmd": "Define", "text": "What is meant by \"microclimate\"?", "src": {"t": "chart", "lbl": "Source A", "cap": "", "chartId": "chart_P6_P6a", "chartCfg": "type:'line',data:{labels:['07:00','09:00','11:00','13:00','15:00','17:00','19:00'],datasets:[{label:'Centre wind (m/s)',data:[0.8,1.1,1.4,1.6,1.5,1.2,0.9],borderColor:'#085041',borderWidth:2,pointRadius:4,tension:0.3,yAxisID:'y1'},{label:'Edge wind (m/s)',data:[1.2,1.8,2.4,2.9,2.6,2.1,1.5],borderColor:'#185FA5',borderWidth:2,pointRadius:4,tension:0.3,borderDash:[5,3],yAxisID:'y1'},{label:'Centre humidity (%)',data:[82,78,72,68,70,75,80],borderColor:'#A32D2D',borderWidth:2,pointRadius:4,tension:0.3,yAxisID:'y2'},{label:'Edge humidity (%)',data:[76,71,64,59,62,67,74],borderColor:'#BA7517',borderWidth:2,pointRadius:4,tension:0.3,borderDash:[5,3],yAxisID:'y2'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{size:9},boxWidth:12}}},scales:{x:{ticks:{font:{size:9}},grid:{display:false}},y1:{type:'linear',position:'left',min:0,max:4,title:{display:true,text:'Wind (m/s)',font:{size:9}},ticks:{font:{size:9},callback:function(v){return v+'m/s'}}},y2:{type:'linear',position:'right',min:50,max:95,title:{display:true,text:'Humidity (%)',font:{size:9}},ticks:{font:{size:9},callback:function(v){return v+'%'}},grid:{display:false}}}}"}, "ans": "A microclimate refers to the climate conditions of a small localised area that differ from the surrounding general climate, due to local factors such as vegetation cover, surface type, proximity to water or building density. For example, the interior of a park may have a cooler, more humid microclimate than the open edge due to shading and transpiration. (1 mark)", "lo": false}, {"id": "P6b", "ao": "AO1", "marks": 2, "cmd": "Calculate", "text": "Calculate the range of wind speeds for (a) Park Centre and (b) Park Edge. Show working.", "src": {"t": "chart", "lbl": "Source A", "cap": "", "chartId": "chart_P6_P6b", "chartCfg": "type:'line',data:{labels:['07:00','09:00','11:00','13:00','15:00','17:00','19:00'],datasets:[{label:'Centre wind (m/s)',data:[0.8,1.1,1.4,1.6,1.5,1.2,0.9],borderColor:'#085041',borderWidth:2,pointRadius:4,tension:0.3,yAxisID:'y1'},{label:'Edge wind (m/s)',data:[1.2,1.8,2.4,2.9,2.6,2.1,1.5],borderColor:'#185FA5',borderWidth:2,pointRadius:4,tension:0.3,borderDash:[5,3],yAxisID:'y1'},{label:'Centre humidity (%)',data:[82,78,72,68,70,75,80],borderColor:'#A32D2D',borderWidth:2,pointRadius:4,tension:0.3,yAxisID:'y2'},{label:'Edge humidity (%)',data:[76,71,64,59,62,67,74],borderColor:'#BA7517',borderWidth:2,pointRadius:4,tension:0.3,borderDash:[5,3],yAxisID:'y2'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{size:9},boxWidth:12}}},scales:{x:{ticks:{font:{size:9}},grid:{display:false}},y1:{type:'linear',position:'left',min:0,max:4,title:{display:true,text:'Wind (m/s)',font:{size:9}},ticks:{font:{size:9},callback:function(v){return v+'m/s'}}},y2:{type:'linear',position:'right',min:50,max:95,title:{display:true,text:'Humidity (%)',font:{size:9}},ticks:{font:{size:9},callback:function(v){return v+'%'}},grid:{display:false}}}}"}, "ans": "(a) Park Centre range = 1.6 - 0.8 = 0.8 m/s (b) Park Edge range = 2.9 - 1.2 = 1.7 m/s (2 marks: 1 per correct answer. Verify against actual data.)", "lo": false}, {"id": "P6c", "ao": "AO2", "marks": 3, "cmd": "Describe", "text": "Describe the patterns of wind speed and humidity at both locations shown in Source A.", "src": {"t": "chart", "lbl": "Source A", "cap": "", "chartId": "chart_P6_P6c", "chartCfg": "type:'line',data:{labels:['07:00','09:00','11:00','13:00','15:00','17:00','19:00'],datasets:[{label:'Centre wind (m/s)',data:[0.8,1.1,1.4,1.6,1.5,1.2,0.9],borderColor:'#085041',borderWidth:2,pointRadius:4,tension:0.3,yAxisID:'y1'},{label:'Edge wind (m/s)',data:[1.2,1.8,2.4,2.9,2.6,2.1,1.5],borderColor:'#185FA5',borderWidth:2,pointRadius:4,tension:0.3,borderDash:[5,3],yAxisID:'y1'},{label:'Centre humidity (%)',data:[82,78,72,68,70,75,80],borderColor:'#A32D2D',borderWidth:2,pointRadius:4,tension:0.3,yAxisID:'y2'},{label:'Edge humidity (%)',data:[76,71,64,59,62,67,74],borderColor:'#BA7517',borderWidth:2,pointRadius:4,tension:0.3,borderDash:[5,3],yAxisID:'y2'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{size:9},boxWidth:12}}},scales:{x:{ticks:{font:{size:9}},grid:{display:false}},y1:{type:'linear',position:'left',min:0,max:4,title:{display:true,text:'Wind (m/s)',font:{size:9}},ticks:{font:{size:9},callback:function(v){return v+'m/s'}}},y2:{type:'linear',position:'right',min:50,max:95,title:{display:true,text:'Humidity (%)',font:{size:9}},ticks:{font:{size:9},callback:function(v){return v+'%'}},grid:{display:false}}}}"}, "ans": "Wind speed at both locations increases from morning (07:00) to a peak around 13:00 then decreases towards evening (19:00). Park Edge consistently records higher wind speeds than Park Centre (e.g. at 13:00: 2.9 vs 1.6 m/s). Relative humidity follows the opposite pattern -- both locations show declining humidity from morning (Park Centre 82%, Park Edge 76%) to a midday minimum (Park Centre 68%, Park Edge 59%), then rising towards evening. Park Centre consistently records higher humidity than Park Edge throughout the day (e.g. at 13:00: 68% vs 59%, a 9 percentage point difference). Both patterns are consistent throughout the measurement period. (3 marks)", "lo": false}, {"id": "P6d", "ao": "AO2", "marks": 4, "cmd": "Explain", "text": "Explain why Park Centre and Park Edge show different wind speed and humidity conditions throughout the day.", "src": {"t": "chart", "lbl": "Source A", "cap": "", "chartId": "chart_P6_P6d", "chartCfg": "type:'line',data:{labels:['07:00','09:00','11:00','13:00','15:00','17:00','19:00'],datasets:[{label:'Centre wind (m/s)',data:[0.8,1.1,1.4,1.6,1.5,1.2,0.9],borderColor:'#085041',borderWidth:2,pointRadius:4,tension:0.3,yAxisID:'y1'},{label:'Edge wind (m/s)',data:[1.2,1.8,2.4,2.9,2.6,2.1,1.5],borderColor:'#185FA5',borderWidth:2,pointRadius:4,tension:0.3,borderDash:[5,3],yAxisID:'y1'},{label:'Centre humidity (%)',data:[82,78,72,68,70,75,80],borderColor:'#A32D2D',borderWidth:2,pointRadius:4,tension:0.3,yAxisID:'y2'},{label:'Edge humidity (%)',data:[76,71,64,59,62,67,74],borderColor:'#BA7517',borderWidth:2,pointRadius:4,tension:0.3,borderDash:[5,3],yAxisID:'y2'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{size:9},boxWidth:12}}},scales:{x:{ticks:{font:{size:9}},grid:{display:false}},y1:{type:'linear',position:'left',min:0,max:4,title:{display:true,text:'Wind (m/s)',font:{size:9}},ticks:{font:{size:9},callback:function(v){return v+'m/s'}}},y2:{type:'linear',position:'right',min:50,max:95,title:{display:true,text:'Humidity (%)',font:{size:9}},ticks:{font:{size:9},callback:function(v){return v+'%'}},grid:{display:false}}}}"}, "ans": "Park Edge records higher wind speeds because it is adjacent to roads and open areas where air flow is unobstructed. The dense tree canopy at Park Centre acts as a windbreak, intercepting and slowing moving air -- wind energy is absorbed by canopy foliage and branches, creating a calmer microclimate in the park interior. (1 mark) Park Centre consistently records higher relative humidity because the dense tree canopy releases large amounts of water vapour through transpiration -- plants releasing water absorbed through roots into the atmosphere via leaves. This continuous water vapour release maintains higher atmospheric humidity in the enclosed park centre. At the park edge, the transpiration effect is less pronounced and humidity is more easily dispersed by higher wind speeds. (1 mark) The daily patterns of both variables -- wind speed peaking at midday and humidity at minimum around midday -- reflect Singapore's tropical diurnal climate cycle. Solar radiation is most intense around midday, driving stronger convective air circulation (higher wind speed) and greater evaporative demand (lower humidity). As solar radiation decreases, convective circulation weakens and humidity rises. (1 mark) The consistently larger humidity difference between Park Centre and Park Edge compared to the wind speed difference suggests that the humidity-moderating effect of tree canopy transpiration is more pronounced than its wind-dampening effect. This has implications for thermal comfort in the park at different locations. (1 mark)", "lo": false}, {"id": "P6e", "ao": "AO2", "marks": 4, "cmd": "Evaluate", "text": "Identify two risks to researchers collecting data in the park throughout the day and suggest how to mitigate each.", "src": null, "ans": "Risk 1: Heat stress from prolonged outdoor exposure in tropical conditions, particularly during 11:00-15:00 peak heat. Temperatures above 35C combined with high humidity can cause heat exhaustion. Mitigation: take rest breaks in shaded areas, stay hydrated, apply sunscreen, wear lightweight light-coloured clothing. (1 mark + 1 mark) Risk 2: Injury from wet or slippery surfaces if rainfall occurs during data collection. Park paths and grass areas may become slippery, increasing fall risk when researchers are focused on reading instruments. Equipment may also be damaged by rain. Mitigation: monitor weather forecasts, carry waterproof equipment covers, exercise extra caution on wet surfaces. (1 mark + 1 mark)", "lo": false}, {"id": "P6f", "ao": "AO3", "marks": 6, "cmd": "Evaluate", "text": "\"The data in Source A provides sufficient evidence to conclude that park vegetation significantly improves microclimate conditions for residents.\" To what extent do you agree?", "src": {"t": "chart", "lbl": "Source A", "cap": "", "chartId": "chart_P6_P6f", "chartCfg": "type:'line',data:{labels:['07:00','09:00','11:00','13:00','15:00','17:00','19:00'],datasets:[{label:'Centre wind (m/s)',data:[0.8,1.1,1.4,1.6,1.5,1.2,0.9],borderColor:'#085041',borderWidth:2,pointRadius:4,tension:0.3,yAxisID:'y1'},{label:'Edge wind (m/s)',data:[1.2,1.8,2.4,2.9,2.6,2.1,1.5],borderColor:'#185FA5',borderWidth:2,pointRadius:4,tension:0.3,borderDash:[5,3],yAxisID:'y1'},{label:'Centre humidity (%)',data:[82,78,72,68,70,75,80],borderColor:'#A32D2D',borderWidth:2,pointRadius:4,tension:0.3,yAxisID:'y2'},{label:'Edge humidity (%)',data:[76,71,64,59,62,67,74],borderColor:'#BA7517',borderWidth:2,pointRadius:4,tension:0.3,borderDash:[5,3],yAxisID:'y2'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{size:9},boxWidth:12}}},scales:{x:{ticks:{font:{size:9}},grid:{display:false}},y1:{type:'linear',position:'left',min:0,max:4,title:{display:true,text:'Wind (m/s)',font:{size:9}},ticks:{font:{size:9},callback:function(v){return v+'m/s'}}},y2:{type:'linear',position:'right',min:50,max:95,title:{display:true,text:'Humidity (%)',font:{size:9}},ticks:{font:{size:9},callback:function(v){return v+'%'}},grid:{display:false}}}}"}, "ans": "Partially agree -- the data shows consistent patterns: Source A shows consistent differences between Park Centre and Park Edge throughout the day -- lower wind speeds at Park Centre (windbreak effect) and higher humidity (transpiration effect). These patterns hold across all seven measurement times, suggesting genuine microclimate differences rather than random variation. (L2-L3) Partially disagree -- significant limitations reduce the strength of conclusions: Data was collected on a single day. Singapore's weather varies significantly -- microclimate differences may be much larger during the dry season than the wet season. Without multiple measurements across different conditions and seasons, the data cannot support a strong conclusion. Additionally, no control measurement from a non-vegetated area (nearby road) is included, making it difficult to assess the park vegetation's relative contribution to microclimate improvement. (L3) Conclusion: I partially agree -- the data provides suggestive evidence of a park vegetation microclimate effect but is insufficient for a definitive conclusion. To strengthen: collect data on multiple occasions across seasons; include a control measurement point outside the park. (L3)", "lo": true}]}, {"id": "P7", "title": "Pedestrian Footfall — Traffic Counts, Orchard Road Shopping District", "fieldwork": "Research question: \"How does pedestrian footfall differ between weekday and weekend at key locations", "intro": "A group of Secondary Four students conducted a pedestrian footfall investigation in the Orchard Road shopping district to understand how the use of key public locations changes between weekdays and weekends. They were interested in how the pattern of pedestrian movement reflects different user group", "questions": [{"id": "P7a", "ao": "AO1", "marks": 2, "cmd": "Identify", "text": "Identify the location with the largest percentage increase on weekends and the location showing a decrease.", "src": {"t": "chart", "lbl": "Source A", "cap": "", "chartId": "chart_P7_P7a", "chartCfg": "type:'bar',data:{labels:['MRT Exit A','Mall entrance','Food court','Side street'],datasets:[{label:'Weekday',data:[312,198,145,42],backgroundColor:'rgba(24,95,165,0.75)',borderWidth:0,borderRadius:3},{label:'Weekend',data:[487,356,189,38],backgroundColor:'rgba(163,45,45,0.75)',borderWidth:0,borderRadius:3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{size:10}}}},scales:{x:{ticks:{font:{size:10}},grid:{display:false}},y:{beginAtZero:true,ticks:{font:{size:10}},title:{display:true,text:'Count per 15 min',font:{size:10}}}}}"}, "ans": "The mall entrance shows the largest percentage increase in weekend footfall -- an 80% increase (from 198 to 356 pedestrians per 15-minute interval). (1 mark) The side street shows a decrease in weekend footfall -- a 10% decrease (from 42 to 38 pedestrians), suggesting fewer residents use the residential side street on weekends, possibly because they are visiting other areas for leisure. (1 mark)", "lo": false}, {"id": "P7b", "ao": "AO2", "marks": 3, "cmd": "Describe", "text": "Describe the pattern of pedestrian footfall across the four locations on weekdays and weekends.", "src": {"t": "chart", "lbl": "Source A", "cap": "", "chartId": "chart_P7_P7b", "chartCfg": "type:'bar',data:{labels:['MRT Exit A','Mall entrance','Food court','Side street'],datasets:[{label:'Weekday',data:[312,198,145,42],backgroundColor:'rgba(24,95,165,0.75)',borderWidth:0,borderRadius:3},{label:'Weekend',data:[487,356,189,38],backgroundColor:'rgba(163,45,45,0.75)',borderWidth:0,borderRadius:3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{size:10}}}},scales:{x:{ticks:{font:{size:10}},grid:{display:false}},y:{beginAtZero:true,ticks:{font:{size:10}},title:{display:true,text:'Count per 15 min',font:{size:10}}}}}"}, "ans": "On both weekdays and weekends, the MRT exit records the highest footfall, followed by the mall entrance, food court and side street in descending order. On weekdays, footfall decreases steeply from MRT exit (312) to side street (42). On weekends, footfall increases at three of the four locations -- MRT exit (+175), mall entrance (+158) and food court (+44) -- but decreases slightly at the side street. The largest absolute increases occur at the MRT exit and mall entrance, reflecting the dominant role of shopping and leisure in driving weekend flows to Orchard Road. (3 marks)", "lo": false}, {"id": "P7c", "ao": "AO2", "marks": 4, "cmd": "Explain", "text": "Explain why the pedestrian footfall pattern differs between weekday and weekend at the four locations.", "src": {"t": "chart", "lbl": "Source A", "cap": "", "chartId": "chart_P7_P7c", "chartCfg": "type:'bar',data:{labels:['MRT Exit A','Mall entrance','Food court','Side street'],datasets:[{label:'Weekday',data:[312,198,145,42],backgroundColor:'rgba(24,95,165,0.75)',borderWidth:0,borderRadius:3},{label:'Weekend',data:[487,356,189,38],backgroundColor:'rgba(163,45,45,0.75)',borderWidth:0,borderRadius:3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{size:10}}}},scales:{x:{ticks:{font:{size:10}},grid:{display:false}},y:{beginAtZero:true,ticks:{font:{size:10}},title:{display:true,text:'Count per 15 min',font:{size:10}}}}}"}, "ans": "The MRT exit and mall entrance show the largest weekend increases because Orchard Road is Singapore's primary retail and entertainment district -- weekend visitors arriving specifically for shopping, dining and leisure create a surge at key entry points. On weekdays, the dominant group is office workers and commuters with more routine patterns; on weekends, leisure visitors who cluster around peak shopping and dining times dominate. (1 mark) The mall entrance shows the largest percentage increase (+80%) rather than the MRT exit (+56%) because not all MRT users are bound for the mall on weekdays (some commute to offices or schools). On weekends, a higher proportion of MRT arrivals are specifically leisure visitors bound for the mall, hence the larger percentage increase at the mall entrance. (1 mark) The food court shows a smaller increase (+30%) because food courts serve both weekday workers (lunch breaks) and weekend visitors -- the weekday baseline is relatively high. The smaller percentage increase reflects the more balanced weekday-weekend usage pattern of food services compared to retail. (1 mark) The side street shows a slight decrease in weekend footfall because it primarily serves the residential community. On weekdays, residents use it for commuting; on weekends, the same residents may leave the neighbourhood for leisure elsewhere, reducing local pedestrian traffic. (1 mark)", "lo": false}, {"id": "P7d", "ao": "AO2", "marks": 4, "cmd": "Evaluate", "text": "Suggest two improvements to make the investigation findings more reliable and comprehensive.", "src": {"t": "chart", "lbl": "Source A", "cap": "", "chartId": "chart_P7_P7d", "chartCfg": "type:'bar',data:{labels:['MRT Exit A','Mall entrance','Food court','Side street'],datasets:[{label:'Weekday',data:[312,198,145,42],backgroundColor:'rgba(24,95,165,0.75)',borderWidth:0,borderRadius:3},{label:'Weekend',data:[487,356,189,38],backgroundColor:'rgba(163,45,45,0.75)',borderWidth:0,borderRadius:3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{size:10}}}},scales:{x:{ticks:{font:{size:10}},grid:{display:false}},y:{beginAtZero:true,ticks:{font:{size:10}},title:{display:true,text:'Count per 15 min',font:{size:10}}}}}"}, "ans": "Conduct counts at multiple times of day -- pedestrian patterns in a shopping district vary significantly by time of day. A single 12:00-12:15 pm count may not represent the full daily pattern. Recording at multiple slots (10 am, 12 pm, 3 pm, 6 pm) would produce a more comprehensive picture of how footfall varies across the day and between weekdays and weekends. (1 mark + 1 mark) Conduct counts on multiple weekdays and multiple weekends -- a single weekday and weekend day may be atypical due to weather, school holidays, special events or public holidays. Averaging across multiple occasions would produce more reliable representative figures, reducing the influence of atypical conditions. (1 mark + 1 mark)", "lo": false}, {"id": "P7e", "ao": "AO1", "marks": 1, "cmd": "Evaluate", "text": "Identify one limitation of convenience sampling for selecting the four counting locations.", "src": null, "ans": "Convenience sampling means researchers selected locations that were easy or convenient to access, potentially excluding locations with interesting pedestrian patterns in less accessible areas (back entrances, underground walkways, skybridge connections). This makes the sample unrepresentative of all pedestrian movement in the Orchard Road district. (1 mark)", "lo": false}, {"id": "P7f", "ao": "AO3", "marks": 6, "cmd": "Evaluate", "text": "\"Pedestrian footfall data alone is sufficient to understand how urban neighbourhoods are used by different groups of people.\" Do you agree?", "src": {"t": "chart", "lbl": "Source A", "cap": "", "chartId": "chart_P7_P7f", "chartCfg": "type:'bar',data:{labels:['MRT Exit A','Mall entrance','Food court','Side street'],datasets:[{label:'Weekday',data:[312,198,145,42],backgroundColor:'rgba(24,95,165,0.75)',borderWidth:0,borderRadius:3},{label:'Weekend',data:[487,356,189,38],backgroundColor:'rgba(163,45,45,0.75)',borderWidth:0,borderRadius:3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{size:10}}}},scales:{x:{ticks:{font:{size:10}},grid:{display:false}},y:{beginAtZero:true,ticks:{font:{size:10}},title:{display:true,text:'Count per 15 min',font:{size:10}}}}}"}, "ans": "Partially agree -- footfall data reveals important spatial and temporal patterns: Source A demonstrates that count data reveals meaningful patterns about how locations are used differently on weekdays and weekends -- the MRT exit and mall entrance show large weekend increases (leisure visitors) while the side street shows a decrease (residents leaving for leisure). This informs decisions about opening hours, staffing, cleaning and security needs. (L2-L3) Disagree -- footfall data has major limitations for understanding user groups: Pedestrian count data cannot reveal who is using the space, why they are there, how long they stay, how they feel or what would improve their experience. Two locations with identical footfall may be used by completely different groups for completely different purposes. To understand how different groups (elderly, families, tourists, workers) use urban spaces, qualitative methods such as questionnaire surveys, semi-structured interviews and mental maps are essential complements. (L3) Conclusion: I disagree that footfall data alone is sufficient -- it is a valuable quantitative starting point revealing patterns and trends, but must be complemented with qualitative data to develop a complete understanding. The appropriate sequence: use footfall data (quantitative) to identify patterns, then interviews or questionnaires (qualitative) to examine those patterns in depth. (L3)", "lo": true}]}, {"id": "P8", "title": "Soil Erosion — Infiltration Rates on Different Slopes, MacRitchie", "fieldwork": "A group of Secondary Four students conducted a soil erosion fieldwork investigation at MacRitchie Re", "intro": "A group of Secondary Four students conducted a soil erosion fieldwork investigation at MacRitchie Reservoir Park to examine whether slope gradient affects the rate at which water infiltrates into the soil, and therefore the risk of surface runoff and soil erosion. They were aware that certain sectio", "questions": [{"id": "P8a", "ao": "AO1", "marks": 1, "cmd": "Define", "text": "What is meant by \"infiltration rate\" in the context of fieldwork on soil erosion?", "src": {"t": "chart", "lbl": "Source A", "cap": "", "chartId": "chart_P8_P8a", "chartCfg": "type:'bar',data:{labels:['Point 1','Point 2','Point 3','Point 4','Point 5'],datasets:[{label:'Gentle slope ~5 deg (ml/min)',data:[48,52,45,55,50],backgroundColor:'rgba(39,80,10,0.8)',borderWidth:0,borderRadius:3},{label:'Steep slope ~25 deg (ml/min)',data:[22,19,25,18,21],backgroundColor:'rgba(163,45,45,0.75)',borderWidth:0,borderRadius:3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{size:10}}}},scales:{x:{ticks:{font:{size:10}},grid:{display:false}},y:{beginAtZero:true,ticks:{font:{size:10}},title:{display:true,text:'Infiltration (ml/min)',font:{size:10}}}}}"}, "ans": "Infiltration rate refers to the rate at which water is absorbed into the soil, measured as the volume of water (ml) entering the soil per minute. Higher infiltration rates mean more water is absorbed into the soil, leaving less water to flow as surface runoff -- reducing the potential for erosion. Lower infiltration rates mean more surface runoff, which can transport soil particles downslope. (1 mark)", "lo": false}, {"id": "P8b", "ao": "AO1", "marks": 2, "cmd": "Calculate", "text": "Calculate the mean infiltration rate for (a) the gentle slope and (b) the steep slope. Show working.", "src": {"t": "chart", "lbl": "Source A", "cap": "", "chartId": "chart_P8_P8b", "chartCfg": "type:'bar',data:{labels:['Point 1','Point 2','Point 3','Point 4','Point 5'],datasets:[{label:'Gentle slope ~5 deg (ml/min)',data:[48,52,45,55,50],backgroundColor:'rgba(39,80,10,0.8)',borderWidth:0,borderRadius:3},{label:'Steep slope ~25 deg (ml/min)',data:[22,19,25,18,21],backgroundColor:'rgba(163,45,45,0.75)',borderWidth:0,borderRadius:3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{size:10}}}},scales:{x:{ticks:{font:{size:10}},grid:{display:false}},y:{beginAtZero:true,ticks:{font:{size:10}},title:{display:true,text:'Infiltration (ml/min)',font:{size:10}}}}}"}, "ans": "(a) Gentle slope mean = (48+52+45+55+50) / 5 = 250 / 5 = 50.0 ml/min (b) Steep slope mean = (22+19+25+18+21) / 5 = 105 / 5 = 21.0 ml/min (2 marks: 1 per correct answer with working shown. Verify against actual data.)", "lo": false}, {"id": "P8c", "ao": "AO2", "marks": 4, "cmd": "Compare", "text": "Compare infiltration rates on the gentle and steep slopes and explain what this suggests about relative erosion risk.", "src": {"t": "chart", "lbl": "Source A", "cap": "", "chartId": "chart_P8_P8c", "chartCfg": "type:'bar',data:{labels:['Point 1','Point 2','Point 3','Point 4','Point 5'],datasets:[{label:'Gentle slope ~5 deg (ml/min)',data:[48,52,45,55,50],backgroundColor:'rgba(39,80,10,0.8)',borderWidth:0,borderRadius:3},{label:'Steep slope ~25 deg (ml/min)',data:[22,19,25,18,21],backgroundColor:'rgba(163,45,45,0.75)',borderWidth:0,borderRadius:3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{size:10}}}},scales:{x:{ticks:{font:{size:10}},grid:{display:false}},y:{beginAtZero:true,ticks:{font:{size:10}},title:{display:true,text:'Infiltration (ml/min)',font:{size:10}}}}}"}, "ans": "Source A shows consistently higher infiltration rates at all 5 test points on the gentle slope (range: 45-55 ml/min, mean: 50.0 ml/min) compared to the steep slope (range: 18-25 ml/min, mean: 21.0 ml/min). The gentle slope mean is approximately 2.4 times higher than the steep slope mean -- a substantial and consistent difference with no overlap between the two data sets (lowest gentle slope value 45 ml/min is still considerably higher than the highest steep slope value 25 ml/min). (2 marks) This pattern suggests the steep slope has a significantly higher erosion risk. With mean infiltration rates of only 21 ml/min, the steep slope allows much more rainfall to remain as surface runoff. This surface runoff flows downslope with increasing velocity, picking up and transporting soil particles -- the fundamental mechanism of surface erosion. The gentle slope's higher infiltration means most rainfall is absorbed, leaving little water for surface flow and therefore lower erosion potential. (2 marks)", "lo": false}, {"id": "P8d", "ao": "AO2", "marks": 4, "cmd": "Explain", "text": "Explain why infiltration rates are lower on the steep slope than on the gentle slope.", "src": {"t": "chart", "lbl": "Source A", "cap": "", "chartId": "chart_P8_P8d", "chartCfg": "type:'bar',data:{labels:['Point 1','Point 2','Point 3','Point 4','Point 5'],datasets:[{label:'Gentle slope ~5 deg (ml/min)',data:[48,52,45,55,50],backgroundColor:'rgba(39,80,10,0.8)',borderWidth:0,borderRadius:3},{label:'Steep slope ~25 deg (ml/min)',data:[22,19,25,18,21],backgroundColor:'rgba(163,45,45,0.75)',borderWidth:0,borderRadius:3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{size:10}}}},scales:{x:{ticks:{font:{size:10}},grid:{display:false}},y:{beginAtZero:true,ticks:{font:{size:10}},title:{display:true,text:'Infiltration (ml/min)',font:{size:10}}}}}"}, "ans": "On steep slopes, rainwater flows downslope more rapidly under gravity before it has time to infiltrate into the soil. The high velocity of surface water on steep terrain means it is continuously flowing over the soil surface rather than sitting in contact with it long enough to be absorbed, reducing the opportunity for infiltration. (1 mark) Steep slopes also tend to have thinner, more compacted soil profiles because surface erosion progressively removes the upper, more porous soil layers, leaving behind compacted subsoil with lower porosity. Lower soil porosity directly reduces the rate at which water can penetrate into the soil. (1 mark) Vegetation cover may also differ -- gentle slopes often support denser ground cover vegetation that intercepts rainfall (reducing raindrop impact energy on soil surface), creates root channels improving soil porosity and holds soil particles in place. Steep slopes may have sparser ground cover due to the physical difficulty of root anchoring. (1 mark) The higher erosion risk on steep slopes has direct implications for trail management at MacRitchie. Heavy visitor traffic on steep sections compacts soil further, reducing infiltration and accelerating erosion. Trail management interventions such as boardwalks, drainage channels and revegetation address this dynamic. (1 mark)", "lo": false}, {"id": "P8e", "ao": "AO2", "marks": 3, "cmd": "Evaluate", "text": "Identify two risks to researchers on steep slopes in a nature reserve and suggest how to mitigate each.", "src": null, "ans": "Risk 1: Slipping or falling on steep slopes, particularly if wet or muddy. Mitigation: wear hiking boots with good grip, use a trekking pole for stability, avoid data collection immediately after heavy rainfall when slopes are most slippery. (1 mark) Risk 2: Disturbing or damaging the nature reserve ecosystem through repeated footfall at measurement points -- potentially harming rare plants, disturbing wildlife nesting sites or compacting sensitive soil. Mitigation: limit the number of measurements at each point, stay on designated trails where possible, consult NParks about appropriate locations before fieldwork. (1 mark) Risk 3 (for 3rd mark): Getting lost or isolated on steep terrain away from main trails. Mitigation: work in groups of at least two, carry a fully charged mobile phone, inform a responsible adult of fieldwork location and expected return time, carry a printed trail map. (1 mark)", "lo": false}, {"id": "P8f", "ao": "AO3", "marks": 6, "cmd": "Evaluate", "text": "\"The mean is the most appropriate measure of central tendency to compare infiltration rates between the two slopes.\" To what extent do you agree?", "src": {"t": "chart", "lbl": "Source A", "cap": "", "chartId": "chart_P8_P8f", "chartCfg": "type:'bar',data:{labels:['Point 1','Point 2','Point 3','Point 4','Point 5'],datasets:[{label:'Gentle slope ~5 deg (ml/min)',data:[48,52,45,55,50],backgroundColor:'rgba(39,80,10,0.8)',borderWidth:0,borderRadius:3},{label:'Steep slope ~25 deg (ml/min)',data:[22,19,25,18,21],backgroundColor:'rgba(163,45,45,0.75)',borderWidth:0,borderRadius:3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{size:10}}}},scales:{x:{ticks:{font:{size:10}},grid:{display:false}},y:{beginAtZero:true,ticks:{font:{size:10}},title:{display:true,text:'Infiltration (ml/min)',font:{size:10}}}}}"}, "ans": "Agree -- mean is appropriate when values are consistent within each group: Source A shows gentle slope values range from 45-55 ml/min (range of 10 ml/min) and steep slope values from 18-25 ml/min (range of 7 ml/min). Both ranges are small relative to the means (50.0 and 21.0 ml/min), suggesting consistent data within each slope without extreme outliers. In this situation, the mean accurately represents the typical infiltration rate and is appropriate for comparison. (L2-L3) Partially disagree -- median and mode also provide useful information: With only 5 data points per slope, the mean may be influenced by a single atypical measurement. Checking the median alongside the mean improves the validity of comparisons. In this case, the median would give 50 ml/min for gentle slope and 21 ml/min for steep slope -- the same as the means, confirming their reliability. This coincidence should not be assumed in all datasets. (L3) Conclusion: I agree the mean is appropriate for this investigation given the consistent within-slope data and small sample size. However, reporting both mean and median alongside the full data table and a visual gives the most complete picture and allows verification that the mean is indeed representative. (L3)", "lo": true}]}, {"id": "P9", "title": "Noise Pollution — Decibel Readings at Distance from PIE Expressway", "fieldwork": "Noise Pollution — Decibel Readings at Distance from PIE Expressway", "intro": "A group of Secondary Four students conducted a noise pollution investigation near the Pan Island Expressway (PIE) in Singapore to understand how expressway traffic noise affects the quality of the residential environment at different distances from the road. They were concerned that residents living", "questions": [{"id": "P9a", "ao": "AO1", "marks": 2, "cmd": "Identify", "text": "At which distance do peak noise levels first fall at or below the NEA guideline of 65 dB? Do off-peak levels meet the guideline at all distances measured?", "src": {"t": "chart", "lbl": "Source A", "cap": "", "chartId": "chart_P9_P9a", "chartCfg": "type:'line',data:{labels:['10m','25m','50m','100m','200m','400m'],datasets:[{label:'Peak 7-9am (dB)',data:[82,76,70,65,59,54],borderColor:'#A32D2D',backgroundColor:'rgba(163,45,45,0.08)',borderWidth:2,pointRadius:5,tension:0.2,fill:true},{label:'Off-peak 11am-1pm (dB)',data:[74,68,63,58,53,49],borderColor:'#185FA5',backgroundColor:'rgba(24,95,165,0.08)',borderWidth:2,pointRadius:5,tension:0.2,fill:true}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{size:10}}}},scales:{x:{ticks:{font:{size:10}},grid:{display:false},title:{display:true,text:'Distance from PIE',font:{size:10}}},y:{min:40,max:90,ticks:{font:{size:10},callback:function(v){return v+' dB'}},title:{display:true,text:'Noise (dB)',font:{size:10}}}}}"}, "ans": "Peak noise levels reach 65 dB at exactly 100 metres from the expressway (equal to the guideline). They fall clearly below the guideline at 200 metres (59 dB). (1 mark) Off-peak noise levels are below the NEA residential guideline of 65 dB from 50 metres onwards (63 dB at 50m) and at all subsequent distances. However, at 10m (74 dB) and 25m (68 dB) they still exceed the guideline. (1 mark)", "lo": false}, {"id": "P9b", "ao": "AO2", "marks": 3, "cmd": "Describe", "text": "Describe the patterns of peak and off-peak noise levels as distance from the expressway increases.", "src": {"t": "chart", "lbl": "Source A", "cap": "", "chartId": "chart_P9_P9b", "chartCfg": "type:'line',data:{labels:['10m','25m','50m','100m','200m','400m'],datasets:[{label:'Peak 7-9am (dB)',data:[82,76,70,65,59,54],borderColor:'#A32D2D',backgroundColor:'rgba(163,45,45,0.08)',borderWidth:2,pointRadius:5,tension:0.2,fill:true},{label:'Off-peak 11am-1pm (dB)',data:[74,68,63,58,53,49],borderColor:'#185FA5',backgroundColor:'rgba(24,95,165,0.08)',borderWidth:2,pointRadius:5,tension:0.2,fill:true}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{size:10}}}},scales:{x:{ticks:{font:{size:10}},grid:{display:false},title:{display:true,text:'Distance from PIE',font:{size:10}}},y:{min:40,max:90,ticks:{font:{size:10},callback:function(v){return v+' dB'}},title:{display:true,text:'Noise (dB)',font:{size:10}}}}}"}, "ans": "Both peak and off-peak noise levels decrease with increasing distance from the PIE expressway, from a maximum of 82 dB (peak) and 74 dB (off-peak) at 10 metres to a minimum of 54 dB (peak) and 49 dB (off-peak) at 400 metres. Peak noise levels are consistently higher than off-peak at every distance -- the difference is 8 dB at 10 metres and decreases slightly to 5 dB at 400 metres. Both show a curved (non-linear) pattern of decrease -- noise levels fall more steeply between 10 and 50 metres than between 100 and 400 metres, reflecting the non-linear relationship between distance and sound attenuation. (3 marks)", "lo": false}, {"id": "P9c", "ao": "AO1", "marks": 2, "cmd": "Calculate", "text": "Calculate the percentage difference between peak and off-peak noise at (a) 10m and (b) 400m. Show working.", "src": {"t": "chart", "lbl": "Source A", "cap": "", "chartId": "chart_P9_P9c", "chartCfg": "type:'line',data:{labels:['10m','25m','50m','100m','200m','400m'],datasets:[{label:'Peak 7-9am (dB)',data:[82,76,70,65,59,54],borderColor:'#A32D2D',backgroundColor:'rgba(163,45,45,0.08)',borderWidth:2,pointRadius:5,tension:0.2,fill:true},{label:'Off-peak 11am-1pm (dB)',data:[74,68,63,58,53,49],borderColor:'#185FA5',backgroundColor:'rgba(24,95,165,0.08)',borderWidth:2,pointRadius:5,tension:0.2,fill:true}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{size:10}}}},scales:{x:{ticks:{font:{size:10}},grid:{display:false},title:{display:true,text:'Distance from PIE',font:{size:10}}},y:{min:40,max:90,ticks:{font:{size:10},callback:function(v){return v+' dB'}},title:{display:true,text:'Noise (dB)',font:{size:10}}}}}"}, "ans": "(a) 10m: % difference = (82-74) / 74 x 100 = 8/74 x 100 = 10.8% (accept 10.7-10.9%) (b) 400m: % difference = (54-49) / 49 x 100 = 5/49 x 100 = 10.2% (accept 10.1-10.3%) (2 marks: 1 per correct answer with working shown. Verify against actual data.)", "lo": false}, {"id": "P9d", "ao": "AO2", "marks": 4, "cmd": "Explain", "text": "Explain why noise levels decrease with increasing distance and why peak levels are higher than off-peak.", "src": {"t": "chart", "lbl": "Source A", "cap": "", "chartId": "chart_P9_P9d", "chartCfg": "type:'line',data:{labels:['10m','25m','50m','100m','200m','400m'],datasets:[{label:'Peak 7-9am (dB)',data:[82,76,70,65,59,54],borderColor:'#A32D2D',backgroundColor:'rgba(163,45,45,0.08)',borderWidth:2,pointRadius:5,tension:0.2,fill:true},{label:'Off-peak 11am-1pm (dB)',data:[74,68,63,58,53,49],borderColor:'#185FA5',backgroundColor:'rgba(24,95,165,0.08)',borderWidth:2,pointRadius:5,tension:0.2,fill:true}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{size:10}}}},scales:{x:{ticks:{font:{size:10}},grid:{display:false},title:{display:true,text:'Distance from PIE',font:{size:10}}},y:{min:40,max:90,ticks:{font:{size:10},callback:function(v){return v+' dB'}},title:{display:true,text:'Noise (dB)',font:{size:10}}}}}"}, "ans": "Sound waves lose energy as they travel through the air through geometric spreading -- as sound radiates outward from a source, the same amount of energy is spread over an increasingly large area, reducing intensity (dB level) per unit area. Sound energy is also absorbed by the atmosphere and by surfaces (vegetation, soil, buildings) as it travels, further attenuating noise levels with distance. (1 mark) During peak hours (7-9 am), significantly more vehicles use the PIE -- the morning rush hour generates high traffic volumes with frequent acceleration and braking producing loud engine and tyre noise. More vehicles per unit time means more simultaneous noise sources, raising the overall noise level above off-peak. (1 mark) Vehicle type also differs -- peak hours include more heavy vehicles (lorries, buses) generating significantly more noise than private cars. Since dB levels increase logarithmically with sound intensity, even a small number of heavy vehicles can substantially raise average noise levels. (1 mark) Practical implication: Residential buildings within 50-100m of the PIE expressway are exposed to noise levels above the NEA residential guideline of 65 dB during peak hours -- highlighting the importance of noise barriers, vegetation buffers and sound-insulating building design for developments near major expressways. (1 mark)", "lo": false}, {"id": "P9e", "ao": "AO2", "marks": 4, "cmd": "Evaluate", "text": "Suggest two improvements to make the conclusions more valid and reliable.", "src": {"t": "chart", "lbl": "Source A", "cap": "", "chartId": "chart_P9_P9e", "chartCfg": "type:'line',data:{labels:['10m','25m','50m','100m','200m','400m'],datasets:[{label:'Peak 7-9am (dB)',data:[82,76,70,65,59,54],borderColor:'#A32D2D',backgroundColor:'rgba(163,45,45,0.08)',borderWidth:2,pointRadius:5,tension:0.2,fill:true},{label:'Off-peak 11am-1pm (dB)',data:[74,68,63,58,53,49],borderColor:'#185FA5',backgroundColor:'rgba(24,95,165,0.08)',borderWidth:2,pointRadius:5,tension:0.2,fill:true}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{size:10}}}},scales:{x:{ticks:{font:{size:10}},grid:{display:false},title:{display:true,text:'Distance from PIE',font:{size:10}}},y:{min:40,max:90,ticks:{font:{size:10},callback:function(v){return v+' dB'}},title:{display:true,text:'Noise (dB)',font:{size:10}}}}}"}, "ans": "Take measurements on multiple days including weekdays, weekends and different weather conditions -- wind direction and speed significantly affect how sound travels, and noise levels on rainy days differ from dry calm days. Averaging across multiple occasions at each distance would produce more reliable representative values. (1 mark + 1 mark) Extend the range beyond 400 metres -- Source A shows that at 400 metres during peak hours (54 dB) noise is below the NEA guideline, but intermediate distances (150m, 250m, 300m) were not measured. Adding these would provide a more precise picture of the noise attenuation gradient and identify the exact \"safe\" distance for residential development. (1 mark + 1 mark)", "lo": false}, {"id": "P9f", "ao": "AO3", "marks": 6, "cmd": "Evaluate", "text": "\"Noise pollution data alone is sufficient basis for recommending buffer zones between expressways and residential areas in Singapore.\" Do you agree?", "src": {"t": "chart", "lbl": "Source A", "cap": "", "chartId": "chart_P9_P9f", "chartCfg": "type:'line',data:{labels:['10m','25m','50m','100m','200m','400m'],datasets:[{label:'Peak 7-9am (dB)',data:[82,76,70,65,59,54],borderColor:'#A32D2D',backgroundColor:'rgba(163,45,45,0.08)',borderWidth:2,pointRadius:5,tension:0.2,fill:true},{label:'Off-peak 11am-1pm (dB)',data:[74,68,63,58,53,49],borderColor:'#185FA5',backgroundColor:'rgba(24,95,165,0.08)',borderWidth:2,pointRadius:5,tension:0.2,fill:true}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{size:10}}}},scales:{x:{ticks:{font:{size:10}},grid:{display:false},title:{display:true,text:'Distance from PIE',font:{size:10}}},y:{min:40,max:90,ticks:{font:{size:10},callback:function(v){return v+' dB'}},title:{display:true,text:'Noise (dB)',font:{size:10}}}}}"}, "ans": "Partially agree -- noise data identifies the hazard and its spatial extent: Source A provides clear actionable data -- peak noise levels exceed the NEA guideline of 65 dB within 100m of the PIE expressway, giving planners a data-based justification for recommending a minimum 100m buffer zone. This is consistent with the precautionary principle of protecting residents from known health hazards. (L2-L3) Partially disagree -- additional data is needed for comprehensive recommendations: Air pollution from vehicle emissions (PM2.5, nitrogen oxides) may require larger buffer distances than noise. Safety risks from expressway accidents require different assessment. The economic cost of larger buffer zones (reduced housing land) must be weighed against health benefits. Planning recommendations require integration of noise, air quality, safety and economic data to identify the optimal buffer distance. (L3) Conclusion: I partially agree -- noise data provides a necessary and valuable input and is sufficient to justify a minimum buffer based on noise alone. However, comprehensive buffer zone recommendations require integration with air quality data, accident risk assessments and economic analysis. Noise data alone is not sufficient for a fully evidence-based planning recommendation. (L3)", "lo": true}]}, {"id": "P10", "title": "Sense of Place — Questionnaire on Neighbourhood Attachment, Toa Payoh", "fieldwork": "Research question: \"What features of the neighbourhood contribute most to residents' sense of place ", "intro": "A group of Secondary Four students conducted a sense of place investigation in Toa Payoh, one of Singapore's oldest and most established HDB estates, to understand which neighbourhood features residents feel most attached to and why. They were interested in exploring how living in a mature estate wi", "questions": [{"id": "P10a", "ao": "AO1", "marks": 1, "cmd": "Define", "text": "What is meant by a \"Likert scale\" in a questionnaire survey?", "src": {"t": "chart", "lbl": "Source A", "cap": "", "chartId": "chart_P10_P10a", "chartCfg": "type:'bar',data:{labels:['Hawker centre','People/community','Neighbourhood park','Heritage/history','Community centre'],datasets:[{label:'Residents (n=40)',data:[14,10,8,5,3],backgroundColor:['#1A5276','#27500A','#BA7517','#791F1F','#3C3489'],borderWidth:0,borderRadius:3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{font:{size:9}},grid:{display:false}},y:{beginAtZero:true,max:16,ticks:{font:{size:10},stepSize:4},title:{display:true,text:'Residents',font:{size:10}}}}}"}, "ans": "A Likert scale is a type of rating scale that presents participants with a statement and asks them to indicate their level of agreement from a range of predefined responses -- typically: Strongly agree / Agree / Neutral / Disagree / Strongly disagree. The scale allows researchers to capture the strength of participants' opinions and produces quantitative data that can be counted and analysed. (1 mark)", "lo": false}, {"id": "P10b", "ao": "AO1", "marks": 2, "cmd": "Identify", "text": "Using the Q2 Likert results, identify (a) the most common response and (b) the percentage expressing positive attachment (agree or strongly agree).", "src": {"t": "chart", "lbl": "Source A", "cap": "", "chartId": "chart_P10_P10b", "chartCfg": "type:'bar',data:{labels:['Hawker centre','People/community','Neighbourhood park','Heritage/history','Community centre'],datasets:[{label:'Residents (n=40)',data:[14,10,8,5,3],backgroundColor:['#1A5276','#27500A','#BA7517','#791F1F','#3C3489'],borderWidth:0,borderRadius:3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{font:{size:9}},grid:{display:false}},y:{beginAtZero:true,max:16,ticks:{font:{size:10},stepSize:4},title:{display:true,text:'Residents',font:{size:10}}}}}"}, "ans": "(a) The most common response is \"Agree\" -- 17 out of 40 residents (42.5%). (1 mark) (b) Positive attachment (agree + strongly agree) = 12 + 17 = 29 out of 40 = 72.5%. (1 mark)", "lo": false}, {"id": "P10c", "ao": "AO2", "marks": 3, "cmd": "Describe", "text": "Describe the pattern of responses to Q3 about which feature contributes most to residents' sense of place.", "src": {"t": "chart", "lbl": "Source A", "cap": "", "chartId": "chart_P10_P10c", "chartCfg": "type:'bar',data:{labels:['Hawker centre','People/community','Neighbourhood park','Heritage/history','Community centre'],datasets:[{label:'Residents (n=40)',data:[14,10,8,5,3],backgroundColor:['#1A5276','#27500A','#BA7517','#791F1F','#3C3489'],borderWidth:0,borderRadius:3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{font:{size:9}},grid:{display:false}},y:{beginAtZero:true,max:16,ticks:{font:{size:10},stepSize:4},title:{display:true,text:'Residents',font:{size:10}}}}}"}, "ans": "The hawker centre is the most frequently cited feature contributing to sense of place (14 of 40 residents, 35%), the clear leader. People/community is second (10, 25%), followed by neighbourhood park (8, 20%), heritage/history (5, 12.5%) and community centre (3, 7.5%). The distribution is uneven -- the top two features (hawker centre and people/community) account for 60% of all responses, while the bottom two (heritage/history and community centre) account for only 20%. This suggests that social and food-related places are primary contributors to sense of place in Toa Payoh. (3 marks)", "lo": false}, {"id": "P10d", "ao": "AO2", "marks": 4, "cmd": "Explain", "text": "Explain why the hawker centre is the most frequently cited feature contributing to residents' sense of place in Toa Payoh.", "src": {"t": "chart", "lbl": "Source A", "cap": "", "chartId": "chart_P10_P10d", "chartCfg": "type:'bar',data:{labels:['Hawker centre','People/community','Neighbourhood park','Heritage/history','Community centre'],datasets:[{label:'Residents (n=40)',data:[14,10,8,5,3],backgroundColor:['#1A5276','#27500A','#BA7517','#791F1F','#3C3489'],borderWidth:0,borderRadius:3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{font:{size:9}},grid:{display:false}},y:{beginAtZero:true,max:16,ticks:{font:{size:10},stepSize:4},title:{display:true,text:'Residents',font:{size:10}}}}}"}, "ans": "Hawker centres are sites of regular repeated encounters -- many residents visit daily or multiple times a week to purchase meals. This repeated exposure to the same place, stallholders, smells and sounds creates the cumulative familiarity that underlies sense of place. According to sense of place theory, sense of place is developed through repeated encounters with objects and people at specific locations. (1 mark) Hawker centres are also gathering places where residents congregate and interact informally with neighbours. Homemakers who purchase lunch daily develop social relationships with stallholders and regular customers; retirees who meet friends for kopi develop a sense of belonging tied to a specific hawker centre. These social connections give the hawker centre meaning beyond its functional food provision role. (1 mark) In mature estates like Toa Payoh, hawker centres often have decades of history -- serving the same community for 40-50 years and accumulating layers of shared memory across generations. Many residents have childhood memories of visiting specific hawker stalls with their parents, creating historical associations that newer facilities cannot match. (1 mark) The relatively low ranking of heritage/history (12.5%) despite Toa Payoh's historical significance suggests residents develop stronger sense of place through everyday social experiences than through formal heritage awareness. This implies sense of place is primarily social and experiential rather than historical and cognitive -- consistent with the textbook that sense of place develops through \"meanings and memories\" created through personal experience. (1 mark)", "lo": false}, {"id": "P10e", "ao": "AO2", "marks": 4, "cmd": "Evaluate", "text": "Explain why closed-ended questionnaires were used and suggest one advantage and one limitation.", "src": {"t": "chart", "lbl": "Source A", "cap": "", "chartId": "chart_P10_P10e", "chartCfg": "type:'bar',data:{labels:['Hawker centre','People/community','Neighbourhood park','Heritage/history','Community centre'],datasets:[{label:'Residents (n=40)',data:[14,10,8,5,3],backgroundColor:['#1A5276','#27500A','#BA7517','#791F1F','#3C3489'],borderWidth:0,borderRadius:3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{font:{size:9}},grid:{display:false}},y:{beginAtZero:true,max:16,ticks:{font:{size:10},stepSize:4},title:{display:true,text:'Residents',font:{size:10}}}}}"}, "ans": "Closed-ended questionnaires with predefined response options are appropriate because they produce quantitative data that can be easily tabulated, counted and compared across all 40 respondents. Use of predefined categories (hawker centre, park, CC, heritage, people/community) allows direct comparison of frequencies as shown in Source A's pie chart. They also guide respondents who might struggle to articulate sense of place feelings in their own words, making data collection faster and more systematic. (1 mark) Advantage: Predefined response categories make data easy to analyse using measures of frequency (counts and percentages) -- allowing quick visual comparison through pie charts and bar charts and calculation of summary statistics (most common response, total percentage agreeing). (1 mark) Limitation: Closed-ended questionnaires restrict respondents to the researcher's predefined categories and cannot capture nuances not fitting those categories. A resident might feel sense of place derives from a specific heritage tree, a view from their apartment, or a combination of the hawker centre and adjacent void deck -- none expressible within the five Q3 options. The data may miss important sources of sense of place the researcher did not anticipate. (1 mark) To address this, the investigation could complement the questionnaire with semi-structured interviews -- first using the questionnaire to identify overall patterns (quantitative), then interviews to explore specific memories and meanings (qualitative). This quantitative-then-qualitative sequence provides both breadth and depth. (1 mark)", "lo": false}, {"id": "P10f", "ao": "AO3", "marks": 6, "cmd": "Evaluate", "text": "\"Questionnaire surveys with Likert scales are the most effective method for understanding residents' sense of place in urban neighbourhoods.\" To what extent do you agree?", "src": {"t": "chart", "lbl": "Source A", "cap": "", "chartId": "chart_P10_P10f", "chartCfg": "type:'bar',data:{labels:['Hawker centre','People/community','Neighbourhood park','Heritage/history','Community centre'],datasets:[{label:'Residents (n=40)',data:[14,10,8,5,3],backgroundColor:['#1A5276','#27500A','#BA7517','#791F1F','#3C3489'],borderWidth:0,borderRadius:3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{font:{size:9}},grid:{display:false}},y:{beginAtZero:true,max:16,ticks:{font:{size:10},stepSize:4},title:{display:true,text:'Residents',font:{size:10}}}}}"}, "ans": "Partially agree -- Likert scales capture strength of feeling efficiently: Source A's Q2 Likert data shows 72.5% of Toa Payoh residents express positive neighbourhood attachment -- a clear finding from 40 respondents that would be difficult to gather through observation or interviews alone. Likert scales allow quantification of subjective attitudes along a continuous spectrum, useful for comparing sense of place across different neighbourhoods or tracking change over time. (L2-L3) Partially disagree -- questionnaires and Likert scales miss the qualitative depth of sense of place: Sense of place is fundamentally a subjective, experiential phenomenon -- the \"meanings and memories\" constituting it cannot be fully captured by rating scales and predefined categories. A resident might tick \"Strongly agree\" on Q2 for reasons ranging from \"I love the hawker centre\" to \"This is where my parents grew up\" to \"I cannot afford to move.\" Likert data treats all \"Strongly agree\" responses as equivalent, obscuring the diversity of experience central to sense of place theory. Mental maps combined with semi-structured interviews reveal the specific memories, places and people generating sense of place for each resident. (L3) Conclusion: I do not agree that questionnaire surveys are \"the most effective\" method -- they are an efficient method for generating quantitative patterns from large samples, but not the most effective for understanding the subjective depth of sense of place. The most effective approach combines questionnaire surveys (for breadth) with mental maps and semi-structured interviews (for qualitative depth) -- the mixed-methods approach the GEL syllabus recommends for sense of place fieldwork. (L3)", "lo": true}]}];

function renderSidebar(){
  let h='';
  CLUSTERS.forEach(c=>{
    h+=`<div class="sb-cluster">${c.name}</div>`;
    c.topics.forEach(t=>{
      const a=S.topic===t.id?' active':'';
      h+=`<div class="sb-item${a}" onclick="selTopic('${c.id}','${t.id}')">${t.id} ${t.name}${t.sc?' 📋':''}</div>`;
    });
  });
  document.getElementById('sb').innerHTML=h;
}
function selTopic(c,t){S.cluster=c;S.topic=t;renderSidebar();renderMain();}

function renderMain(){
  const el=document.getElementById('bm');
  const cl=CLUSTERS.find(c=>c.id===S.cluster);
  const tp=cl?.topics.find(t=>t.id===S.topic);
  if(!cl||!tp)return;
  let h=`<div style="font-size:16px;font-weight:bold;color:#1A3A6C;margin-bottom:3px">${tp.id}: ${tp.name}</div>
    <div style="font-size:12px;color:#888;margin-bottom:14px">${cl.name}${tp.sc?' · Scenario packages — 20 marks each':''}</div>`;
  if(tp.sc){
    SCENARIOS.forEach((sc,i)=>{
      h+=`<div class="sc-banner" onclick="startSc(${i})">
        <div style="font-size:22px">📋</div>
        <div style="flex:1"><h4>${sc.id}: ${sc.title}</h4><p>${sc.fieldwork} · 20 marks · 6 sub-questions</p></div>
        <button class="btn b-orange b-sm">Start →</button>
      </div>`;
    });
  } else {
    const qs=QUESTIONS[S.topic]||[];
    if(!qs.length){
      h+=`<div class="empty">Questions for this topic are in the companion DOCX files.<br>No questions available for this topic.</div>`;
    } else {
      qs.forEach((q,i)=>{
        const ac=q.ao==='AO1'?'ao1':q.ao==='AO2'?'ao2':'ao3';
        const done=S.user?._scores?.[q.id];
        h+=`<div class="q-card" onclick="startQ(${i})">
          <div class="q-code">${q.id}${done?` <span style="color:#1A7A4A">✓</span>`:''}</div>
          <div class="q-txt"><strong>${q.cmd}:</strong> ${q.text.length>100?q.text.slice(0,100)+'…':q.text}</div>
          <div class="q-meta"><span class="ao-b ${ac}">${q.ao}</span><span class="m-lbl">${q.marks} mk${q.marks>1?'s':''}</span></div>
        </div>`;
      });
    }
  }
  el.innerHTML=h;
}

/* ── PRACTICE ── */
function startQ(i){
  const qs=QUESTIONS[S.topic]||[];if(!qs[i])return;
  S.qList=qs;S.qIdx=i;S.q=qs[i];
  S.scMode=false;S.hints=0;S.submitted=false;S.thinking=false;S.msgs=[];
  renderPractice();show('s-practice');startTimer(timeFor(S.q.ao,S.q.marks));
}
function startSc(i){
  S.scMode=true;S.scIdx=i;S.qIdx=0;
  S.qList=SCENARIOS[i].questions;S.q=S.qList[0];
  S.hints=0;S.submitted=false;S.thinking=false;S.msgs=[];
  renderPractice();show('s-practice');startTimer(timeFor(S.q.ao,S.q.marks));
}
function goSub(i){S.qIdx=i;S.q=S.qList[i];S.hints=0;S.submitted=false;S.thinking=false;S.msgs=[];renderPractice();startTimer(timeFor(S.q.ao,S.q.marks));}
function nextQ(){if(S.qIdx<S.qList.length-1){S.qIdx++;S.q=S.qList[S.qIdx];S.hints=0;S.submitted=false;S.thinking=false;S.msgs=[];renderPractice();startTimer(timeFor(S.q.ao,S.q.marks));}}
function prevQ(){if(S.qIdx>0){S.qIdx--;S.q=S.qList[S.qIdx];S.hints=0;S.submitted=false;S.thinking=false;S.msgs=[];renderPractice();startTimer(timeFor(S.q.ao,S.q.marks));}}
function goBack(){stopTimer();renderSidebar();renderMain();show('s-browser');}

function timeFor(ao,marks){
  if(ao==='AO1')return marks<=1?90:180;
  if(ao==='AO2'){if(marks<=3)return 270;if(marks<=4)return 360;return 480;}
  return marks<=6?660:990;
}
function startTimer(s){stopTimer();S.timerSecs=s;S.timerTarget=s;updTimer();S.timerInt=setInterval(()=>{S.timerSecs--;updTimer();if(S.timerSecs<=0)stopTimer();},1000);}
function stopTimer(){if(S.timerInt){clearInterval(S.timerInt);S.timerInt=null;}}
function updTimer(){
  const el=document.getElementById('tmr');if(!el)return;
  const m=Math.floor(Math.abs(S.timerSecs)/60),s=Math.abs(S.timerSecs)%60;
  const fmt=m+':'+s.toString().padStart(2,'0');
  const pct=S.timerSecs/S.timerTarget;
  el.className='timer';
  if(S.timerSecs<=0){el.textContent='Time up!';el.classList.add('danger');}
  else if(pct<0.25){el.textContent='⏱ '+fmt;el.classList.add('danger');}
  else if(pct<0.5){el.textContent='⏱ '+fmt;el.classList.add('warn');}
  else el.textContent='⏱ '+fmt;
}

function renderPractice(){renderLeft();renderTutor();}
function renderLeft(){
  const el=document.getElementById('pl');const q=S.q;if(!q)return;
  let h='';
  if(S.scMode){
    const sc=SCENARIOS[S.scIdx];
    h+=`<div class="sc-intro"><strong>Fieldwork context:</strong> ${sc.intro}</div>`;
    h+=`<div class="sc-prog">`;
    sc.questions.forEach((_,i)=>{const c=i<S.qIdx?'done':i===S.qIdx?'active':'';h+=`<div class="sc-seg ${c}" onclick="goSub(${i})"></div>`;});
    h+=`</div>`;
  }
  const ac=q.ao==='AO1'?'ao1':q.ao==='AO2'?'ao2':'ao3';
  h+=`<div style="font-size:11px;color:#888;font-family:monospace;letter-spacing:1px;margin-bottom:4px">${q.id}</div>
    <div class="q-big">${q.text}</div>
    <div class="q-tags">
      <span class="ao-b ${ac}">${q.ao}</span>
      <span class="tag">${q.marks} mark${q.marks>1?'s':''}</span>
      <span class="tag">${q.cmd}</span>
      ${q.lo?'<span class="tag tag-lo">LORMS</span>':''}
    </div>`;
  if(q.src){
    const icon=q.src.t==='table'?'📊':q.src.t==='quote'?'📄':'📋';
    h+=`<div class="src-box"><div class="src-lbl">${icon} ${q.src.lbl}</div>`;
    if(q.src.cap)h+=`<div class="src-cap">${q.src.cap}</div>`;
    if(q.src.t==='table')h+=`<table class="src-tbl"><thead><tr>${q.src.hdr.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${q.src.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
    else if(q.src.t==='quote')h+=`<blockquote class="src-quote">${q.src.text}</blockquote>`;
    else if(q.src.t==='chart'){
      const cid='sc_'+q.id+'_chart';
      h+=`<div class="src-chart"><div class="src-chart-lbl">📊 ${q.src.lbl}</div><div class="src-chart-wrap"><canvas id="${cid}"></canvas></div></div>`;
      S._pendingChart={id:cid,cfg:q.src.chartCfg};
    }
    else h+=`<div class="src-note">${q.src.text.replace(/\n/g,'<br>')}</div>`;
    h+=`</div>`;
  }
  h+=`<div class="ans-lbl">Your answer</div>
    <textarea class="ans-box" id="ans-box" placeholder="Write your answer here…" ${S.submitted?'disabled':''}></textarea>
    <div class="a-row">
      ${!S.submitted?`<button class="btn b-green" onclick="doSubmit()">✓ Submit</button>`:''}
      ${!S.submitted?`<button class="btn b-orange" onclick="doHint()" ${S.thinking||S.hints>=S.maxHints?'disabled':''}>💡 I don't know</button>`:''}
      <button class="btn b-white b-sm" onclick="goBack()">← Back</button>
    </div>`;
  if(S.submitted)h+=`<div class="model-box"><div class="model-lbl">Model answer</div><div class="model-txt">${q.ans}</div></div>`;
  h+=`<div id="tmr" class="timer">⏱ --:--</div>`;
  h+=`<div class="nav-row">
    <button class="btn b-white b-sm" onclick="prevQ()" ${S.qIdx===0?'disabled':''}>← Prev</button>
    <span class="nav-info">Q ${S.qIdx+1} / ${S.qList.length}</span>
    <button class="btn b-navy b-sm" onclick="nextQ()" ${S.qIdx>=S.qList.length-1?'disabled':''}>Next →</button>
  </div>`;
  el.innerHTML=h;
  if(S._pendingChart){
    try{
      var cc=S._pendingChart;
      var ctx=document.getElementById(cc.id);
      if(ctx&&typeof Chart!=='undefined'){
        if(ctx._chartInst)ctx._chartInst.destroy();
        var cfg=new Function('return {'+cc.cfg+'}')();
        ctx._chartInst=new Chart(ctx,cfg);
      }
    }catch(e){console.warn('Chart error',e);}
    S._pendingChart=null;
  }
  startTimer(timeFor(q.ao,q.marks));
}

function renderTutor(){
  const msgs=document.getElementById('t-msgs');const acts=document.getElementById('t-acts');
  if(!msgs||!acts)return;
  msgs.innerHTML=`<div class="tmsg ts"><div class="t-lbl">Ready</div>Write your answer and submit, or tap <strong>I don't know</strong> for a progressive hint. Up to ${S.maxHints} hints available. The AI tutor uses the Claude API — ensure you are running this file from a server with a valid API key configured.</div>`+S.msgs.join('');
  if(S.thinking)msgs.innerHTML+=`<div class="thinking"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
  msgs.scrollTop=msgs.scrollHeight;
  let a='';
  if(!S.submitted){
    a+=`<div class="hint-ct">Hints used: ${S.hints} / ${S.maxHints}</div>`;
    a+=`<button class="btn b-orange b-full" onclick="doHint()" ${S.thinking||S.hints>=S.maxHints?'disabled':''}>💡 I don't know — hint</button>`;
    a+=`<button class="btn b-green b-full" onclick="doSubmit()" ${S.thinking?'disabled':''}>✓ Submit answer</button>`;
  } else {
    a+=`<button class="btn b-navy b-full" onclick="nextQ()">Next question →</button>`;
    a+=`<button class="btn b-white b-full" onclick="showProgress()">View my progress →</button>`;
  }
  acts.innerHTML=a;
}

async function doHint(){
  if(S.thinking||S.hints>=S.maxHints)return;
  const q=S.q;const ua=document.getElementById('ans-box')?.value||'';
  S.thinking=true;S.hints++;renderTutor();
  const prompt=`You are a Socratic Geography tutor for Singapore O-Level Geography (Syllabus 2279).
Question (${q.marks} marks): "${q.text}"
Model answer (do not reveal): "${q.ans}"
${ua?`Student attempt: "${ua}"`:'No attempt yet.'}
This is hint ${S.hints} of ${S.maxHints}. Hint 1=general direction, Hint 2=specific concept or case study, Hint 3=more direct pointer. 2-4 sentences, plain text, do not reveal the answer.`;
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:180,messages:[{role:'user',content:prompt}]})});
    const d=await r.json();
    S.msgs.push(`<div class="tmsg th"><div class="t-lbl">Hint ${S.hints}</div>${d.content?.[0]?.text||'Think about the key geographical concepts and link to a Singapore case study.'}</div>`);
  }catch{
    S.msgs.push(`<div class="tmsg th"><div class="t-lbl">Hint ${S.hints}</div>Think about what the source is showing you. What geographical process or relationship does it demonstrate? Link to a specific Singapore case study from the syllabus.</div>`);
  }
  S.thinking=false;renderTutor();
}

async function doSubmit(){
  if(S.thinking||S.submitted)return;
  const q=S.q;const ua=document.getElementById('ans-box')?.value?.trim()||'';
  if(!ua){S.msgs.push(`<div class="tmsg te">Please write your answer before submitting.</div>`);renderTutor();return;}
  S.thinking=true;renderTutor();
  const isL=q.lo;
  const prompt=`You are an SEAB O-Level Geography examiner (Syllabus 2279). Mark this student answer.
Question (${q.marks} marks): "${q.text}"
Model answer: "${q.ans}"
Student answer: "${ua}"
${isL?'LORMS: Level 1 (1-2 marks): vague, no judgement. Level 2 (3-4 marks): some understanding, one-sided. Level 3 (5-6 marks): balanced, well-reasoned. State "Level X — Y marks" clearly.':''}
Give: marks (X/${q.marks}), ${isL?'LORMS level, ':''}strengths (1-2 sentences), what was missing (1-2 sentences), one tip. Concise and encouraging. Plain text.`;
  let marksGot=0,lv=null,fbText='Good attempt! Review the model answer carefully.';
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:300,messages:[{role:'user',content:prompt}]})});
    const d=await r.json();
    fbText=d.content?.[0]?.text||fbText;
    const mm=fbText.match(/(\d+)\s*\/\s*\d+/);if(mm)marksGot=parseInt(mm[1]);
    const lm=fbText.match(/Level\s*([123])/i);if(lm)lv=parseInt(lm[1]);
  }catch{}
  S.submitted=true;
  let fh=`<div class="tmsg tf"><div class="t-lbl">Examiner feedback</div>${fbText}`;
  if(isL&&lv){fh+=`<div class="lbar">${[1,2,3].map(i=>`<div class="lseg ${i<=lv?'on':''}"></div>`).join('')}</div><div class="ltxt">LORMS Level ${lv}/3</div>`;}
  fh+=`</div>`;S.msgs.push(fh);
  S.thinking=false;renderTutor();renderLeft();
  if(S.user){
    saveScore(q.id,marksGot,q.marks,q.ao,ua).catch(e=>console.warn('Score save error',e));
    // Update local cache for sidebar tick marks
    if(!S.user._scores)S.user._scores={};
    S.user._scores[q.id]={marks:marksGot,max:q.marks,date:Date.now()};
    renderLeft();
  }
}

async function hashPw(pw){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(pw));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function doSignup(){
  const name=document.getElementById('f-name')?.value?.trim();
  const school=document.getElementById('f-school')?.value?.trim()||'';
  const email=document.getElementById('f-email')?.value?.trim()?.toLowerCase();
  const pw=document.getElementById('f-pw')?.value;
  if(!name||!email||!pw){authAlert('Please fill in all fields.');return;}
  if(pw.length<6){authAlert('Password must be at least 6 characters.');return;}
  authAlert('Creating account…','info');
  try{
    const existing=await sbGet('users',`email=eq.${encodeURIComponent(email)}&select=email`);
    if(existing.length){authAlert('An account with this email already exists. Please log in.');return;}
    const hash=await hashPw(pw);
    const rows=await sbPost('users',{email,password_hash:hash,name,role:S.role,school});
    const user=rows[0];
    S.user={email:user.email,name:user.name,role:user.role,school:user.school,id:user.id};
    saveSession({email:user.email,role:user.role});
    enterApp();
  }catch(e){authAlert('Sign up failed: '+e.message);}
}

async function doLogin(){
  const email=document.getElementById('f-email')?.value?.trim()?.toLowerCase();
  const pw=document.getElementById('f-pw')?.value;
  if(!email||!pw){authAlert('Please enter your email and password.');return;}
  authAlert('Logging in…','info');
  try{
    const hash=await hashPw(pw);
    const rows=await sbGet('users',`email=eq.${encodeURIComponent(email)}&password_hash=eq.${hash}&select=*`);
    if(!rows.length){authAlert('Incorrect email or password.');return;}
    const user=rows[0];
    if(user.role!==S.role){authAlert(`This account is registered as a ${user.role}. Please select the correct role above.`);return;}
    S.user={email:user.email,name:user.name,role:user.role,school:user.school,id:user.id};
    saveSession({email:user.email,role:user.role});
    enterApp();
  }catch(e){authAlert('Login failed: '+e.message);}
}

function logout(){
  clearSession();S.user=null;S.tClass=null;
  document.getElementById('topbar-right').innerHTML=`<span style="font-size:10px;color:#AABBCC;letter-spacing:2px">SYLLABUS 2279</span>`;
  S.authTab='login';renderAuthForm();show('s-home');
}

async function saveScore(qid,marksGot,marksTotal,ao,answerText){
  if(!S.user)return;
  // Get student's classes
  const memberships=await sbGet('class_members',`student_email=eq.${encodeURIComponent(S.user.email)}&status=eq.approved&select=class_code`);
  const classCode=memberships.length?memberships[0].class_code:null;
  await sbPost('scores',{
    student_email:S.user.email,
    class_code:classCode,
    question_id:qid,
    marks_awarded:marksGot,
    marks_total:marksTotal,
    answer_text:answerText.slice(0,2000)
  });
}

async function loadMyScores(){
  if(!S.user)return{};
  const rows=await sbGet('scores',`student_email=eq.${encodeURIComponent(S.user.email)}&select=question_id,marks_awarded,marks_total,submitted_at&order=submitted_at.desc`);
  const scores={};
  // Keep most recent attempt per question
  rows.forEach(r=>{if(!scores[r.question_id])scores[r.question_id]={marks:r.marks_awarded,max:r.marks_total,date:r.submitted_at};});
  return scores;
}

async function joinClass(){

  const alertEl=document.getElementById('join-alert');
  if(!code){alertEl.innerHTML=`<div class="alert a-err">Please enter a class code.</div>`;return;}
  alertEl.innerHTML=`<div class="alert a-info">Checking code…</div>`;
  try{

async function createClass(){
  const name=document.getElementById('new-cls-name')?.value?.trim();
  const alertEl=document.getElementById('cls-alert');
  if(!name){alertEl.innerHTML=`<div class="alert a-err">Please enter a class name.</div>`;return;}
  const year=new Date().getFullYear();
  const code='GEO-'+name.toUpperCase().replace(/\s/g,'')+'-'+year;
  alertEl.innerHTML=`<div class="alert a-info">Creating class…</div>`;
  try{
    const existing=await sbGet('classes',`code=eq.${code}&select=code`);
    if(existing.length){alertEl.innerHTML=`<div class="alert a-err">A class with this name already exists for ${year}.</div>`;return;}
    await sbPost('classes',{code,name,teacher_email:S.user.email,teacher_name:S.user.name,school:S.user.school||'',year});

}

async function renderTSt(){
  const el=document.getElementById('teacher-main');
  el.innerHTML=`<div class="page-title">Students</div><div class="empty">Loading…</div>`;
  if(!S.tClass)return;
  try{
    const members=await sbGet('class_members',`class_code=eq.${S.tClass}&status=eq.approved&select=student_email,joined_at`);
    if(!members.length){el.innerHTML=`<div class="page-title">Students</div><div class="empty">No enrolled students yet.</div>`;return;}
    const emails=members.map(m=>m.student_email);
    const users=await sbGet('users',`email=in.(${emails.map(e=>encodeURIComponent(e)).join(',')})&select=email,name,school`);
    const userMap={};users.forEach(u=>{userMap[u.email]=u;});
    const scoreRows=await sbGet('scores',`class_code=eq.${S.tClass}&select=student_email,marks_awarded,marks_total,submitted_at&order=submitted_at.desc`);
    // Aggregate per student
    const studentScores={};
    scoreRows.forEach(r=>{
      if(!studentScores[r.student_email])studentScores[r.student_email]=[];
      studentScores[r.student_email].push(r);
    });
    let h=`<div class="page-title">Students</div><div class="page-sub">${members.length} enrolled in ${S.tClass}</div>`;
    members.forEach(m=>{
      const u=userMap[m.student_email]||{};
      const sc=studentScores[m.student_email]||[];
      const attempts=sc.length;
      const avg=attempts?Math.round(sc.reduce((a,r)=>a+(r.marks_awarded/r.marks_total*100),0)/attempts):null;
      h+=`<div style="background:#fff;border:1.5px solid #DDD;border-radius:7px;padding:11px 13px;margin-bottom:8px;display:flex;align-items:center;gap:10px">

        <div style="flex:1">
          <div style="font-size:13px;font-weight:bold;color:#222">${u.name||m.student_email}</div>
          <div style="font-size:11px;color:#888">${m.student_email}</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:16px;font-weight:bold;color:${avg>=60?'#1A7A4A':avg!==null?'#C0392B':'#888'}">${avg!==null?avg+'%':'—'}</div>

}

async function renderTWk(){
  const el=document.getElementById('teacher-main');
  el.innerHTML=`<div class="page-title">Weak spots</div><div class="empty">Loading…</div>`;
  if(!S.tClass)return;
  try{
    const scoreRows=await sbGet('scores',`class_code=eq.${S.tClass}&select=question_id,marks_awarded,marks_total`);
    if(!scoreRows.length){el.innerHTML=`<div class="page-title">Weak spots</div><div class="empty">No attempt data yet.</div>`;return;}
    // Aggregate by topic
    const byTopic={};
    scoreRows.forEach(r=>{
      const topic=r.question_id.match(/Q(\d+\.\d+)/)?.[1]||r.question_id.slice(0,5);
      if(!byTopic[topic])byTopic[topic]={g:0,m:0,count:0};
      byTopic[topic].g+=r.marks_awarded;byTopic[topic].m+=r.marks_total;byTopic[topic].count++;
    });
    const sorted=Object.entries(byTopic).map(([topic,d])=>({topic,pct:Math.round(d.g/d.m*100),count:d.count})).sort((a,b)=>a.pct-b.pct);
    const low=sorted.filter(x=>x.pct<60);const ok=sorted.filter(x=>x.pct>=60);
    let h=`<div class="page-title">Weak spots</div><div class="page-sub">Topics where class average is below 60%</div>`;
    if(low.length){
      h+=low.map(w=>`<div class="weak-item"><div style="flex:1"><div style="font-size:13px;font-weight:bold">Topic ${w.topic}</div><div style="font-size:11px;color:#888">${w.count} attempts</div></div><div style="font-size:18px;font-weight:bold;color:#C0392B">${w.pct}%</div><span class="pill pgr">Needs work</span></div>`).join('');
    } else {
      h+=`<div class="empty" style="color:#1A7A4A">✓ No weak spots — class averaging above 60% on all attempted topics.</div>`;
    }
    if(ok.length){h+=`<div class="sec-lbl" style="margin-top:12px">On track</div>`+ok.map(w=>`<div class="weak-item ok"><div style="flex:1"><div style="font-size:13px;font-weight:bold">Topic ${w.topic}</div><div style="font-size:11px;color:#888">${w.count} attempts</div></div><div style="font-size:18px;font-weight:bold;color:#1A7A4A">${w.pct}%</div><span class="pill pg">On track</span></div>`).join('');}
    el.innerHTML=h;
  }catch(e){el.innerHTML=`<div class="page-title">Weak spots</div><div class="empty">Error: ${e.message}</div>`;}
}

async function init(){

      if(rows.length){
        const user=rows[0];
        S.user={email:user.email,name:user.name,role:user.role,school:user.school,id:user.id};
        S.role=user.role;
        enterApp();return;
      }
    }catch(e){console.warn('Session restore failed',e);}
  }
  renderAuthForm();show('s-home');
}
init();

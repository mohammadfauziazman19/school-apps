.fl{font-size:11px;font-weight:bold;color:#333;text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px;display:block}

.ans-lbl{font-size:11px;font-weight:bold;color:#333;text-transform:uppercase;letter-spacing:1px;margin-bottom:5px;margin-top:11px}
.ans-box{width:100%;border:1.5px solid #AAA;border-radius:6px;padding:9px;font-size:14px;color:#111;font-family:Arial,sans-serif;line-height:1.5;resize:vertical;min-height:100px;background:#fff}

.ans-box:disabled{background:#F5F5F5;color:#555}
.a-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
.nav-row{display:flex;align-items:center;justify-content:space-between;margin-top:13px;padding-top:11px;border-top:1.5px solid #EEE}
.nav-info{font-size:12px;color:#888}
.model-box{background:#F0FFF5;border:1.5px solid #1A7A4A;border-radius:6px;padding:11px;margin-top:9px}
.model-lbl{font-size:10px;font-weight:bold;color:#1A7A4A;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;font-family:monospace}
.model-txt{font-size:13px;color:#111;line-height:1.5}
/* TIMER */
.timer{background:#EEF2F8;border:1.5px solid #1A3A6C;border-radius:20px;padding:4px 12px;font-size:12px;font-weight:bold;color:#1A3A6C;font-family:monospace;display:inline-block;margin-top:9px}

.timer.danger{background:#FFEEEE;border-color:#C0392B;color:#C0392B;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.5}}
/* SCENARIO */
.sc-intro{background:#FFFDE7;border:1.5px solid #C47B0A;border-radius:6px;padding:10px;margin-bottom:11px;font-size:13px;color:#333;line-height:1.5;font-style:italic}
.sc-prog{display:flex;gap:5px;margin-bottom:11px}
.sc-seg{flex:1;height:6px;border-radius:3px;background:#DDD;cursor:pointer}
.sc-seg.done{background:#1A7A4A}.sc-seg.active{background:#C47B0A}
/* TUTOR */
.t-hdr{padding:10px 14px;background:#1A3A6C;flex-shrink:0}
.t-title{font-size:13px;font-weight:bold;color:#fff;display:flex;align-items:center;gap:7px}
.t-dot{width:7px;height:7px;border-radius:50%;background:#2ECC71;display:inline-block}
.t-sub{font-size:11px;color:#AABBCC;margin-top:2px}
.t-msgs{flex:1;padding:10px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;background:#F5F6F8}
.tmsg{border-radius:6px;padding:10px;font-size:12px;line-height:1.5}
.t-lbl{font-size:10px;font-weight:bold;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px;font-family:monospace}
.ts{background:#fff;border:1px solid #CCC;color:#333}.ts .t-lbl{color:#888}
.th{background:#FFFDE7;border:1.5px solid #C47B0A;color:#222}.th .t-lbl{color:#7A4000}
.tf{background:#F0FFF5;border:1.5px solid #1A7A4A;color:#111}.tf .t-lbl{color:#1A7A4A}
.te{background:#FFEEEE;border:1.5px solid #C0392B;color:#111}
.lbar{display:flex;gap:4px;margin-top:7px}
.lseg{flex:1;height:6px;border-radius:3px;background:#CCC}.lseg.on{background:#1A7A4A}
.ltxt{font-size:11px;color:#1A7A4A;font-weight:bold;margin-top:3px}
.thinking{display:flex;gap:5px;align-items:center;padding:6px 0}
.dot{width:7px;height:7px;border-radius:50%;background:#888;animation:bob 1.2s ease-in-out infinite}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes bob{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
.t-acts{padding:10px;border-top:1.5px solid #DDD;display:flex;flex-direction:column;gap:7px;background:#fff;flex-shrink:0}
.hint-ct{font-size:11px;color:#888;text-align:center;font-family:monospace}
/* TABLES + PILLS */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{background:#1A3A6C;color:#fff;padding:7px 9px;text-align:left;font-size:12px;font-weight:bold}
.tbl td{padding:7px 9px;border-bottom:1px solid #EEE;color:#222;vertical-align:middle}
.tbl tr:hover td{background:#F5F6F8}.tbl tr:last-child td{border-bottom:none}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:bold}
.pg{background:#DDFAEE;color:#1A6B3C;border:1px solid #97C459}
.pr{background:#FFEEEE;color:#C0392B;border:1px solid #F09595}
.po{background:#FFF3CC;color:#7A4000;border:1px solid #C47B0A}
.pgr{background:#F0F0F0;color:#555;border:1px solid #CCC}
.bar-row{display:grid;grid-template-columns:120px 1fr 38px;gap:8px;align-items:center;margin-bottom:7px}
.bar-n{font-size:12px;color:#333}
.bar-t{background:#EEE;border-radius:3px;height:8px;overflow:hidden}
.bar-f{height:100%;border-radius:3px;transition:width .5s}
.bar-p{font-size:11px;color:#888;font-family:monospace;text-align:right}
.divider{height:1.5px;background:#EEE;margin:11px 0}
.sec-lbl{font-size:11px;font-weight:bold;color:#1A3A6C;text-transform:uppercase;letter-spacing:2px;margin-bottom:8px;margin-top:13px}
.page-title{font-size:16px;font-weight:bold;color:#1A3A6C;margin-bottom:4px}
.page-sub{font-size:12px;color:#888;margin-bottom:13px}
.empty{background:#fff;border:1.5px dashed #CCC;border-radius:7px;padding:22px;text-align:center;font-size:13px;color:#888;line-height:1.7}
.ov-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:11px}
.join-item{background:#fff;border:1.5px solid #DDD;border-radius:7px;padding:11px 13px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:9px}

.score-row:last-child{border-bottom:none}
</style>

const CLUSTERS=[
  {id:'gel',name:'GEL Cluster',topics:[{id:'1.1',name:'Thinking Geographically'},{id:'1.2',name:'Sustainable Development'},{id:'1.3',name:'Geographical Methods',sc:true}]},
  {id:'tourism',name:'Tourism Cluster',topics:[{id:'2.1',name:'Tourism Trends'},{id:'2.2',name:'Tourism Development'},{id:'2.3',name:'Sustainable Tourism'}]},

  {id:'singapore',name:'Singapore Cluster',topics:[{id:'5.1',name:'Food Security'},{id:'5.2',name:'Water Security'},{id:'5.3',name:'Energy Security'}]},
];

const QUESTIONS={
  '1.1':[
    {id:'Q1.1a',ao:'AO1',marks:1,cmd:'Define',text:'What is meant by "sense of place"?',src:null,
     ans:'Sense of place refers to the importance, meanings and memories people associate with specific locations in their neighbourhoods, acquired through experiences with natural and built environments and interactions with others at these locations.'},
    {id:'Q1.1b',ao:'AO1',marks:2,cmd:'State',text:'State two ways in which nature areas benefit people in their neighbourhoods.',src:null,
     ans:'(1) Nature areas lower air temperatures through shading by trees and vegetation, reducing the urban heat island effect. (2) Nature areas provide space for recreation and leisure, helping residents maintain physical and mental well-being.'},
    {id:'Q1.1c',ao:'AO2',marks:3,cmd:'Explain',text:'Using Source A, explain the interdependent relationship between local communities and nearby nature areas.',
     src:{t:'table',lbl:'Source A',cap:'Interdependent relationship between people and nature (GEL Textbook, Syllabus 2279)',
      hdr:['Direction','How it occurs','Singapore example'],
      rows:[['People depend on nature','Nature provides essentials; spaces for recreation','NParks Therapeutic Gardens improve well-being'],
            ['Nature depends on people','People tend to health of nearby nature areas','Green Wave campaign educates youths about conservation'],
            ['People bring disadvantages','Visitors cause soil erosion, damage vegetation','Trampling on trails in Central Catchment Nature Reserve'],
            ['Nature brings disadvantages','Wildlife may harm people; limits on development','Wild boars venturing into residential areas']]},
     ans:'Source A shows people and nature are fundamentally interdependent. People depend on nature for essentials and recreation. Nature also depends on people through conservation efforts like the Green Wave campaign. The relationship also involves mutual disadvantages: visitors cause erosion in nature areas, while wildlife can harm residents and environmental protection limits development.'},
    {id:'Q1.1d',ao:'AO2',marks:4,cmd:'Explain',text:"Using Source D and your own knowledge, explain how media representations can enhance or contradict people's sense of place.",
     src:{t:'quote',lbl:'Source D',cap:'Adapted from GEL Textbook, Syllabus 2279',text:"Using the hashtag #sgmemory, Instagram users share photographs of memorable experiences of places around Singapore, building a collective digital archive of neighbourhood memories. Websites featuring the history of Beaulieu House in Sembawang develop people's appreciation for the place. However, the negative media portrayal of Yishun following coverage of unusual incidents caused the Nee Soon Town Council and residents to share official statistics to show that Yishun is a typical Singapore town."},
     ans:"Source D explains that media can enhance sense of place — #sgmemory posts build a collective digital archive of positive neighbourhood memories. However, media can also contradict sense of place: the negative portrayal of Yishun created a reputation contradicting residents' lived experiences, prompting a defensive community response."},
    {id:'Q1.1e',ao:'AO3',marks:6,cmd:'Evaluate',lo:true,text:'"The sense of place that people develop in their neighbourhoods is more strongly shaped by natural environments than by built environments." To what extent do you agree?',src:null,
     ans:"Agree: Nature areas generate strong memorable sense of place through sensory richness. Disagree: The built environment — HDB blocks, void decks, hawker centres — dominates most Singaporeans' daily lives. Conclusion: Natural environments do not more strongly shape sense of place than built environments for most Singaporeans. The strongest sense of place emerges where natural and built environments are well-integrated."},
  ],
  '1.2':[
    {id:'Q1.2a',ao:'AO1',marks:1,cmd:'Define',text:'What is meant by "sustainable development"?',src:null,
     ans:'Sustainable development refers to development that meets the needs of the present population while ensuring the ability of future generations to meet their own needs.'},
    {id:'Q1.2b',ao:'AO2',marks:3,cmd:'Explain',text:"Using Source C, explain how different types of ecosystem services benefit people in Singapore's urban neighbourhoods.",
     src:{t:'table',lbl:'Source C',cap:'Four types of ecosystem services in Singapore (GEL Textbook, Syllabus 2279)',
      hdr:['Type','Definition','Singapore example'],
      rows:[['Provisioning','Tangible resources — food, water','Community gardens at Tampines HDB rooftops; reservoirs'],
            ['Regulating','Benefits from ecosystem processes','Trees in Bishan-AMK Park cool temperatures, reduce runoff'],
            ['Cultural','Non-material benefits — aesthetics, recreation','Bukit Timah Nature Reserve — hiking, fieldwork, appreciation'],
            ['Supporting','Services that make all others possible','Wild bees pollinate community gardens; trees maintain oxygen']]},
     ans:'Source C shows provisioning services provide the most tangible benefits — fresh water and food from urban ecosystems. Regulating services from Bishan-AMK Park perform continuous environmental management. Cultural services from Bukit Timah Nature Reserve contribute to mental health and sense of place, while supporting services like pollination make all other ecosystem services possible.'},
    {id:'Q1.2c',ao:'AO3',marks:6,cmd:'Evaluate',lo:true,text:'"Investing in urban green infrastructure is the most cost-effective approach to achieving sustainable urban neighbourhoods." To what extent do you agree?',
     src:{t:'quote',lbl:'Source M',cap:'Adapted from GEL Textbook, Syllabus 2279',text:'"The ecosystem services that our parks and nature areas provide — cooling, flood control, clean air, mental health restoration — save us money that we would otherwise spend on air conditioning, drainage infrastructure, healthcare and mental health services. Every dollar spent on green infrastructure is an investment that pays back across multiple dimensions of urban sustainability." — Urban planner'},
     ans:"Agree: Source M's argument is well-supported — the HDB Green Towns Programme reduces energy consumption; naturalised waterways reduce stormwater costs. Disagree: Green infrastructure cannot address all sustainability challenges. Conclusion: Green infrastructure is highly cost-effective but is one important element within a comprehensive sustainability strategy, not the single most cost-effective approach."},
  ],
};

(function(){
  var extra={"2.1": [{"id": "Q2.1.a", "ao": "AO1", "marks": 1, "cmd": "Define", "text": "What is meant by a \"tourist generating region\"?", "src": null, "ans": "A tourist generating region is a place where tourists originate — it is the permanent place of residence of tourists, from which they depart to travel to tourist destination regions. (1 mark)", "lo": false}, {"id": "Q2.1.b", "ao": "AO1", "marks": 1, "cmd": "State", "text": "State one push factor and one pull factor that motivate tourists to travel.", "src": null, "ans": "Push factor: Stress from work / desire to escape routine / boredom with daily life. (½ mark) Pull factor: Attractive natural scenery / cultural heritage / relaxation activities available at the destination. (½ mark) Both required for 1 mark.", "lo": false}, {"id": "Q2.1.c", "ao": "AO1", "marks": 2, "cmd": "State", "text": "State two ways in which growth in disposable incomes has contributed to the growth of tourism.", "src": null, "ans": "Higher disposable incomes give people more money to spend on travel, accommodation and leisure activities at tourist destinations. (1 mark) Higher disposable incomes increase people's ability to travel, as they can afford the costs of air tickets, hotels and tour packages that were previously out of reach. (1 mark)", "lo": false}, {"id": "Q2.1.d", "ao": "AO1", "marks": 2, "cmd": "Identify", "text": "Identify two characteristics of Venturer-type tourists.", "src": null, "ans": "Venturers spend money more readily and are guided by their personal judgement rather than authority figures in making travel decisions. (1 mark) Venturers prefer to be spontaneous, travel alone, and explore less-developed, unique places where they can participate in new experiences and activities — often setting travel trends for others. (1 mark)", "lo": false}, {"id": "Q2.1.e", "ao": "AO1", "marks": 3, "cmd": "State", "text": "State three characteristics of the stagnation stage in the Tourist Area Cycle of Evolution.", "src": null, "ans": "Tourist arrivals have peaked and begin to decline as the destination has reached or exceeded its carrying capacity, resulting in negative environmental and social effects. (1 mark) The destination may no longer be as attractive as it once was — facilities and attractions may have become old and run down, and tourists start to feel the location has nothing new to offer them. (1 mark) Contributions of tourism to the local economy begin to stagnate, threatening the livelihoods of local businesses and residents who depend on tourism. (1 mark)", "lo": false}, {"id": "Q2.1.g", "ao": "AO2", "marks": 4, "cmd": "Explain", "text": "Using Source B and your own knowledge, explain how the tourism system operates as an interconnected system and why changes in one part affect other parts.", "src": {"t": "note", "lbl": "Source B", "cap": "Model Answer:", "text": "See companion HTML file for source data."}, "ans": "Source B shows that the COVID-19 pandemic caused a 74% collapse in international tourist arrivals in 2020 — demonstrating how disruptions to transit routes (border closures, flight cancellations) immediately cut off the flow of tourists between generating and destination regions. When transit routes shut down, the entire tourism system ceased to function. (1 mark) The collapse of tourist arrivals from generating regions like China, Germany and the USA caused cascading economic damage in destination regions — Source B shows Thailand's arrivals collapsed from 39.8 million to fewer than 7 million, threatening the livelihoods of millions of workers in hotels, restaurants, transport and leisure activities. (1 mark) The US$1.3 trillion in lost export revenues described in Source B shows that the impacts cascaded far beyond the immediate tourism sector — businesses and organisations in both tourist generating regions (airlines, travel agents, tour operators) and destination regions (hotels, restaurants, local attractions) are mutually dependent. When one part of the system fails, all interdependent parts suffer simultaneously. (1 mark) Source B also shows that recovery in the tourism system is similarly interconnected — as vaccinations spread and borders reopened, traveller confidence returned and the Middle East became the first region to exceed pre-pandemic levels. Positive changes in transit routes and generating regions restore the flow of tourists through the entire system, triggering recovery across all destination regions. (1 mark)", "lo": false}, {"id": "Q2.1.h", "ao": "AO2", "marks": 4, "cmd": "Explain", "text": "Using Source C and your own knowledge, explain the factors that have led to the dramatic growth of international tourism since 1950.", "src": {"t": "note", "lbl": "Source C", "cap": "Model Answer:", "text": "See companion HTML file for source data."}, "ans": "Source C shows that international tourist arrivals grew from just 25 million in 1950 to over 1.5 billion by 2019 — a 60-fold increase driven by multiple reinforcing factors. The acceleration from the 1990s onward coincides with rapid growth in disposable incomes across both developed and newly emerging economies, giving more people the financial ability to travel internationally. (1 mark) The growth in mobility in travel — through the expansion of global aviation infrastructure, the introduction of fuel-efficient jet aircraft reducing air travel costs, and the growth of budget airlines like AirAsia and Ryanair — dramatically lowered the cost barrier to international travel, enabling hundreds of millions more people to afford overseas trips. (1 mark) Business innovations shown by the steep growth from the 1990s onward reflect the role of online booking platforms (Expedia, Booking.com, Airbnb) and digital marketing, which made it far easier and cheaper for tourists to research, plan and book international travel independently — removing the reliance on expensive travel agents and opening up a far wider range of destinations. (1 mark) The dramatic drop in Source C in 2020 — from 1.5 billion to 400 million — confirms the strength of the underlying growth factors: when COVID-19 removed the ability to travel through border closures, arrivals collapsed immediately, and the rapid partial recovery to 963 million by 2022 shows how strong the pent-up motivation and ability to travel remained. (1 mark)", "lo": false}, {"id": "Q2.1.j", "ao": "AO2", "marks": 4, "cmd": "Explain", "text": "Using Source E and your own knowledge, explain how changes in transport and business innovations have increased the mobility and ability of tourists.", "src": {"t": "note", "lbl": "Source E", "cap": "Model Answer:", "text": "See companion HTML file for source data."}, "ans": "Source E provides a compelling illustration of improved ability — a London-New York return flight fell from 70% of the average annual UK salary in 1952 to less than 1% by 2022. This dramatic reduction in the cost of international air travel — driven by wide-body aircraft, industry deregulation and low-cost carriers — gave hundreds of millions of ordinary working people the financial ability to travel internationally for the first time. (1 mark) The introduction of wide-body aircraft in the 1970s described in Source E directly enhanced tourist mobility by dramatically increasing the carrying capacity of each flight, reducing per-seat costs and enabling airlines to open new long-haul routes. This expanded the range of destinations that tourists could practically reach, transforming regions like Southeast Asia and the Caribbean into accessible mass tourism destinations. (1 mark) The emergence of low-cost carriers (LCCs) from the 1990s described in Source E created an entirely new tourism market segment — stimulating demand among price-sensitive tourists who had never previously flown. LCCs opened new secondary airport routes, expanded intra-regional travel and enabled short-break tourism that would have been impossible with traditional full-service airline pricing. (1 mark) The growth of online booking platforms — enabling tourists to compare prices, read reviews and book flights, accommodation and activities directly — represents a business innovation that has reduced both the cost and effort of international travel planning. Source E shows this has contributed to a total of more than 4 billion air passenger journeys annually, demonstrating how transport improvements and digital business innovations have together created an era of unprecedented tourist mobility. (1 mark)", "lo": false}, {"id": "Q2.1.l", "ao": "AO2", "marks": 4, "cmd": "Explain", "text": "Using Source G and your own knowledge, explain how carrying capacity relates to the Tourist Area Cycle of Evolution and what it means for the management of tourist destinations.", "src": {"t": "note", "lbl": "Source G", "cap": "Model Answer:", "text": "See companion HTML file for source data."}, "ans": "Source G shows that Maya Bay's carrying capacity was dramatically exceeded when arrivals reached up to 5,000 per day. This directly relates to the stagnation stage of the Tourist Area Cycle, where tourist numbers peak at or beyond the destination's carrying capacity, resulting in negative environmental impacts: coral destruction, water pollution and ecosystem degradation. (1 mark) When a destination exceeds its carrying capacity and enters decline, Source G shows that intervention becomes necessary to prevent permanent environmental damage. Thai authorities chose complete closure — reflecting the severity of the ecological damage. This was only possible because the destination's natural environment was the primary tourist resource, and its recovery required complete removal of tourist pressure. (1 mark) The successful recovery of Maya Bay — with coral cover and marine life returning during the four-year closure — demonstrates the potential for rejuvenation when destinations take decisive action. This corresponds to Butler's rejuvenation stage, achieved through restoring the natural environment that originally attracted tourists. (1 mark) The strict management rules introduced at Maya Bay's reopening — visitor cap of 375 per day, no combustion engines, no overnight stays — demonstrate how effective destination management must permanently constrain tourist numbers below carrying capacity to prevent a return to the stagnation/decline cycle. Sustainable tourism requires demand management alongside supply, ensuring that the destination's primary attractions are protected for future generations. (1 mark)", "lo": false}, {"id": "Q2.1.o", "ao": "AO2", "marks": 5, "cmd": "Explain", "text": "Using Source J and your own knowledge, explain how the interaction between tourist personality characteristics and the Tourist Area Cycle of Evolution shaped Iceland's tourism development.", "src": {"t": "note", "lbl": "Source J", "cap": "Model Answer:", "text": "See companion HTML file for source data."}, "ans": "Source J shows Iceland's transformation from 489,000 visitors in 2010 to 2.3 million by 2018 — a pattern that directly reflects the Tourist Area Cycle of Evolution. In the early stage (pre-2010), Iceland was in the exploration stage, attracting Venturer-type tourists drawn by its extraordinary and largely undiscovered natural landscapes — glaciers, geysers, volcanoes and the Northern Lights. (1 mark) Source J illustrates how Venturer-type tourists set travel trends for Dependables — the dramatic landscapes were documented through viral social media and Instagram photography, transforming Iceland into a globally recognised destination. This media exposure bridges the gap between the exploration/involvement stages and the rapid development stage, dramatically accelerating the transition that might otherwise have taken decades. (1 mark) As Iceland's reputation grew through Venturer-initiated social media content, growing numbers of Dependable-type tourists drove arrivals to 2.3 million. This corresponds to the development/consolidation stage of Butler's model, where destinations experience rapid growth in tourist numbers, increasing infrastructure development and advertising, and growing numbers of less adventurous tourists. (1 mark) Source J demonstrates how exceeding carrying capacity triggers the onset of stagnation — overcrowding and queues at key sites threatened the very authenticity and pristine natural beauty that attracted tourists initially. When carrying capacity is exceeded, the destination risks losing its appeal to Venturer-type tourists, who will move on to new undiscovered destinations. (1 mark) Iceland's government response — visitor capacity limits and increased fees — reflects the management principle that destination regions must actively control demand to prevent the stagnation/decline trajectory. By limiting access to key sites, Iceland is attempting to maintain the quality of tourist experience that sustains its appeal to both Venturer and Dependable types — a strategy consistent with sustainable tourism management principles. (1 mark)", "lo": false}, {"id": "Q2.1.p", "ao": "AO3", "marks": 6, "cmd": "Evaluate", "text": "Using Source K and your own knowledge, to what extent do you agree that the Tourist Area Cycle of Evolution is a useful model for understanding how tourist destinations develop? Explain your answer.", "src": {"t": "note", "lbl": "Source K", "cap": "Model Answer (Level 3 — 5-6 marks):", "text": "See companion HTML file for source data."}, "ans": "Model Answer (Level 3 — 5-6 marks): Agree — the cycle provides a useful framework for understanding destination development: The Tourist Area Cycle of Evolution provides a powerful conceptual framework identifying the key stages — exploration, involvement, development, consolidation, stagnation and decline/rejuvenation — and the mechanisms that drive progression through them, including growing tourist numbers, infrastructure development and eventually the degradation of carrying capacity. Maya Bay, Thailand provides compelling real-world evidence — tourist numbers grew from a handful of Venturer-type visitors in the 1990s to 5,000 per day by the 2010s, destroying the very coral reef environment that attracted them, exactly as the model predicts for the stagnation/decline stage. Iceland's trajectory from 489,000 visitors in 2010 to 2.3 million by 2018 also mirrors the cycle's development/consolidation stages closely. Partially agree — Source K correctly identifies limitations: However, Source K raises valid criticisms. The cycle's deterministic implication that all destinations will inevitably reach stagnation and decline is not well-supported by evidence. Singapore's Sentosa Island has been continuously rejuvenated through sustained government investment and has never reached stagnation. Bhutan has deliberately constrained itself to the involvement stage through strict visitor limits and high-value tourism policies, never experiencing the mass tourism development the cycle would predict. These examples show that proactive management can override the cycle's predicted trajectory. Conclusion: On balance, I agree that the cycle is a useful model but not a deterministic one. As Source K argues, it is best understood as a warning — not a prediction — of what happens when destinations fail to manage their development proactively. Its value lies in helping managers identify which stage a destination is at and what interventions are needed to avoid negative outcomes.", "lo": true}, {"id": "Q2.1.r", "ao": "AO3", "marks": 9, "cmd": "Evaluate", "text": "\"Venturer-type tourists are more beneficial than Dependable-type tourists for tourist destination regions.\" To what extent do you agree with this statement? Explain your answer.", "src": null, "ans": "Model Answer (Level 3 — 7-9 marks): Agree — Venturers bring unique benefits to destination regions: Venturer-type tourists provide several distinctive benefits that Dependable-type tourists do not. Venturers travel to less-developed destinations in the exploration and involvement stages, bringing tourism income to regions that have not yet attracted mass tourism. Their willingness to explore off-the-beaten-track destinations helps distribute tourism benefits more broadly — beyond established mass tourism hotspots. Venturers spend money more readily and are more likely to engage directly with local businesses, homestays and community-based services rather than foreign-owned mass tourism operators, meaning more of their spending is retained in the local economy with less leakage. Partially disagree — Dependables generate greater scale and economic stability: However, Dependable-type tourists — who make up the large majority of the global tourism market — generate far greater absolute economic benefits at established destinations through sheer numbers. Destinations like Bali, Phuket and Paris receive tens of millions of Dependable-type mass tourists annually, generating billions of dollars in tourism receipts, millions of jobs and significant government tax revenues. While individual Dependables may spend more cautiously, their aggregate spending vastly exceeds that of the much smaller number of Venturers. Dependable tourists also provide economic stability through predictable, repeat visitation patterns that allow businesses to plan and invest with confidence. Partially disagree — Venturers can inadvertently trigger mass tourism development: While Venturers are often portrayed as environmentally sensitive, their role in 'discovering' new destinations can inadvertently trigger the development/consolidation cycle that eventually brings the mass tourism they sought to avoid. By documenting their experiences on social media and travel blogs, Venturers generate the awareness that attracts growing numbers of Dependables — as Iceland's viral Instagram transformation from 489,000 to 2.3 million visitors illustrates. Nuanced evaluation — context determines which type is more beneficial: The relative benefit of Venturer versus Dependable tourists ultimately depends on the specific destination and its stage in the Tourist Area Cycle. For a destination in the exploration or involvement stage — like Bhutan — Venturer-type high-value, low-volume tourism is clearly more sustainable. For a destination in the development or consolidation stage — like Bali — the large volumes of Dependable tourists are essential to the local economy. The statement's implication that one type is universally 'more beneficial' oversimplifies the complex interplay between tourist personality, destination characteristics and management quality. Conclusion: On balance, I partially agree that Venturer-type tourists can be more beneficial in specific contexts — particularly for fragile, early-stage destinations where their tendency towards authentic, community-based and lower-impact tourism produces more sustainable outcomes. However, at scale and for established destination economies, Dependable-type mass tourists generate greater absolute economic benefits. The most successful tourist destinations attract a healthy mix of both types.", "lo": true}, {"id": "Q2.1.s", "ao": "AO3", "marks": 6, "cmd": "Evaluate", "text": "Using Source M and your own knowledge, to what extent do you agree that limiting tourist numbers is the most effective way to ensure a destination remains attractive in the long run? Explain your answer.", "src": {"t": "note", "lbl": "Source M", "cap": "Model Answer (Level 3 — 5-6 marks):", "text": "See companion HTML file for source data."}, "ans": "Model Answer (Level 3 — 5-6 marks): Agree — visitor limits protect carrying capacity and long-term appeal: Source M makes a compelling case that the most successful long-term destinations — Bhutan, the Galapagos, the Swiss Alps — resisted maximising short-term arrivals. Bhutan's deliberate policy of limiting tourist arrivals to ~145,000 per year through a high daily fee has protected its extraordinary cultural and natural landscape from the overcrowding and commodification that has damaged many other Asian destinations. Maya Bay's recovery after a complete closure demonstrates that strict visitor limits — 375 people per day after reopening — can successfully restore and maintain a destination's primary appeal. Partially disagree — limits alone are insufficient; active management and reinvestment are also needed: However, visitor limits alone do not guarantee long-term attractiveness. The Swiss Alps and Galapagos cited in Source M succeed not only because they limit numbers but because they combine limits with strict environmental protection, high-quality tourism infrastructure and continuous product development. Singapore's Sentosa Island — which receives ~30 million visits per year — has maintained its attractiveness through continuous active reinvestment, not through visitor limits. This suggests that proactive management and investment can be equally or more effective than limits alone for destinations with larger carrying capacities. Conclusion: On balance, I agree that managing tourist numbers relative to carrying capacity is essential for long-term destination attractiveness — particularly for fragile natural or cultural environments. However, visitor limits are most effective when combined with environmental protection, high standards of tourist experience and continuous reinvestment in destination quality. For some destinations with greater carrying capacity, active management and reinvestment may be more appropriate than strict limits.", "lo": true}, {"id": "Q2.1.t", "ao": "AO3", "marks": 9, "cmd": "Evaluate", "text": "\"Improvements in mobility — particularly the growth of aviation — have been the most important factor in the growth of international tourism since 1950.\" To what extent do you agree with this statement? Explain your answer.", "src": null, "ans": "Model Answer (Level 3 — 7-9 marks): Agree — aviation has been the single most transformative enabler of international tourism growth: The growth of aviation since the 1950s has been the most direct and powerful enabler of international tourism growth. A London-New York return flight fell from approximately 70% of the average UK annual salary in 1952 to less than 1% by 2022 — making international long-haul travel accessible to ordinary working people for the first time. The introduction of wide-body aircraft in the 1970s (Boeing 747), industry deregulation from the 1980s, and the emergence of low-cost carriers like AirAsia and Ryanair from the 1990s collectively created a global aviation network of unprecedented coverage and affordability. The global commercial aircraft fleet grew from ~5,000 in 1970 to ~25,000 in 2022, enabling new international routes that connected previously inaccessible destinations. When air travel was virtually halted in 2020 during COVID-19, international tourist arrivals collapsed by 74% immediately — confirming that aviation is the arterial system of the global tourism economy. Partially disagree — growth in disposable incomes and ability to travel are equally fundamental: However, aviation's impact on mobility would have been largely irrelevant without the parallel growth in tourists' ability to travel — particularly the dramatic growth in global disposable incomes and paid vacation time. The global middle class grew from ~0.6 billion in 1970 to ~4.1 billion in 2022, giving billions more people the financial means to afford international travel. Countries that introduced mandatory paid vacation — in Europe, Japan and increasingly in Asia — gave their populations the time as well as the money needed to travel internationally. Without this growth in income and leisure time, cheaper and more accessible aviation would simply have reduced the cost of something most people still could not afford. Partially disagree — motivation to travel and business innovations are also significant: The motivation to travel — individuals' growing desire for relaxation, self-fulfilment and unique travel experiences — cannot be reduced to a mere by-product of mobility and income. The transformation of tourism from an elite privilege to a mass aspiration reflects deep social changes: rising education levels that created interest in different cultures; social media that generated travel aspirations through shared experiences; and a post-war global culture that increasingly valued exploration. Business innovations — online booking platforms, budget accommodation services like Airbnb, travel review sites like TripAdvisor — further amplified motivation and ability by dramatically reducing the information and transaction costs of international travel planning. Nuanced evaluation — all three factors are mutually reinforcing: The growth of international tourism since 1950 is best understood as the product of three mutually reinforcing factors — motivation, ability and mobility — operating simultaneously rather than any single dominant cause. Aviation improvements created the possibility of affordable international travel; growth in disposable incomes and paid vacation created the financial and temporal ability to take advantage of that possibility; and growing motivation to seek new experiences created the demand that drove both aviation expansion and income growth. Conclusion: On balance, I agree that aviation — as the primary driver of improved mobility — has been the single most important enabling factor in international tourism growth, in that without affordable air travel, the international dimension of tourism could not have reached its current scale regardless of income growth or motivation. However, the dramatic growth of international tourism since 1950 is a genuinely multi-causal phenomenon — aviation enabled it, but rising incomes, paid vacation and growing motivation created the demand that made aviation expansion worthwhile.", "lo": true}], "2.2": [{"id": "Q2.2.a", "ao": "AO1", "marks": 1, "cmd": "Define", "text": "What is meant by \"economic leakage\" in the context of tourism?", "src": null, "ans": "Economic leakage occurs when revenue generated by tourism in the destination region is lost to the economies of other countries — for example, when tourist businesses pay for imported goods and services, or when profits are repatriated by foreign-owned tourism companies. (1 mark)", "lo": false}, {"id": "Q2.2.b", "ao": "AO1", "marks": 1, "cmd": "State", "text": "State one positive economic impact and one negative economic impact of tourism on destination regions.", "src": null, "ans": "Positive: Tourism creates employment opportunities in formal and informal tourism sectors, reducing unemployment and generating income for local residents. (½ mark) Negative: Economic leakage reduces the actual tourism revenue retained in the local economy, as money flows out to foreign-owned businesses or imported goods. (½ mark) Both required for 1 mark.", "lo": false}, {"id": "Q2.2.c", "ao": "AO1", "marks": 2, "cmd": "State", "text": "State two ways in which globalisation has influenced trends in international tourism.", "src": null, "ans": "Globalisation has increased the ability to travel by enabling people to search for and buy tourism-related services from anywhere, creating greater competition among businesses and more affordable travel options. (1 mark) Globalisation has increased tourists' motivation to travel by giving people greater access to information about tourism destinations and experiences through new online media and social media, stimulating desire to visit places they previously had no knowledge of. (1 mark)", "lo": false}, {"id": "Q2.2.d", "ao": "AO1", "marks": 2, "cmd": "Identify", "text": "Identify two negative social impacts of tourism on destination regions.", "src": null, "ans": "Commodification of traditional cultural practices and art forms — as demand for heritage tourism increases, traditions may be exaggerated, staged or mass-produced for tourists, losing their authenticity and cultural value. (1 mark) Cultural clashes — differences in values, beliefs and behaviours between tourists and local communities can create hostility, discomfort and conflict, particularly when tourists fail to respect local customs and norms. (1 mark)", "lo": false}, {"id": "Q2.2.e", "ao": "AO1", "marks": 3, "cmd": "State", "text": "State three ways in which tourism can cause negative environmental impacts on destination regions.", "src": null, "ans": "Greenhouse gas emissions from aviation and other transport used by tourists contribute to air pollution and climate change. (1 mark) Inadequate sewage facilities or improper waste disposal at tourist destinations pollutes water bodies and soils, harming aquatic and terrestrial ecosystems. (1 mark) Construction of hotels, resorts and tourist facilities encroaches on natural habitats, depletes natural resources such as timber and freshwater, and threatens wildlife habitats and biodiversity. (1 mark)", "lo": false}, {"id": "Q2.2.g", "ao": "AO2", "marks": 4, "cmd": "Explain", "text": "Using Source B and your own knowledge, explain how changing demand and changing supply have transformed international tourism in recent years.", "src": {"t": "note", "lbl": "Source B", "cap": "Model Answer:", "text": "See companion HTML file for source data."}, "ans": "Source B shows that demand for tourism has shifted from standardised mass market packages towards unique, personalised and authentic experiences — driving growth in adventure, heritage, sports, wellness and medical tourism. This shift reflects changes in tourist motivation: tourists are increasingly seeking self-fulfilment, personal discovery and differentiated experiences rather than the predictable comfort of conventional package holidays. (1 mark) Source B explains that the supply of tourism has been transformed by technology — traditional travel agencies and print brochures have been largely replaced by online booking platforms such as Booking.com, Expedia and Airbnb, which give tourists direct access to accommodation and experiences globally. This disintermediation has dramatically reduced the cost and complexity of travel planning, enabling independent tourism to grow rapidly. (1 mark) Source B highlights the transformative power of social media — particularly Instagram and TikTok — as tourism marketing tools. A single viral post can transform an obscure destination into a global must-visit overnight, as demonstrated by Iceland's rapid growth from 489,000 to 2.3 million visitors between 2010 and 2018, driven largely by viral photography of its dramatic landscapes. This represents a fundamental shift in tourism marketing from top-down advertising by mass market operators to peer-to-peer content created by individual tourists. (1 mark) Source B also notes that small specialist tour operators have carved out profitable niches by offering deeply tailored experiences that mass market operators cannot replicate. This reflects the broader trend of supply diversification — the tourism market now supports a much wider spectrum of operators, from global online travel agencies to boutique specialists offering highly personalised itineraries for small groups, creating opportunities for local entrepreneurs to compete with large foreign-owned operators. (1 mark)", "lo": false}, {"id": "Q2.2.i", "ao": "AO2", "marks": 4, "cmd": "Explain", "text": "Using Source D and your own knowledge, explain how economic leakage reduces the benefit of tourism for destination regions and why overdependence on tourism creates vulnerability.", "src": {"t": "note", "lbl": "Source D", "cap": "Model Answer:", "text": "See companion HTML file for source data."}, "ans": "Source D reveals the shocking scale of economic leakage — for every US$100 spent by a tourist in a developing country, only US$5 remains in the local host community, meaning 95% leaks out. This occurs through multiple channels: tourism businesses importing food, beverages and equipment from overseas; foreign-owned hotels and tour operators repatriating profits; and skilled workers being brought from abroad rather than trained locally. Each of these leakage pathways removes money that could otherwise circulate through the local economy, multiplying income and employment benefits for local communities. (1 mark) Source D explains that leakages are particularly severe in small island tourism economies like the Maldives, where almost all food, fuel and building materials must be imported. The paradox is that the most tourism-dependent economies often face the highest leakage rates, because their small size and limited industrial capacity mean they cannot produce the goods that tourist facilities require, forcing heavy dependence on imports that drain revenue offshore. (1 mark) Overdependence on tourism creates acute economic vulnerability because a sudden fall in tourist numbers — due to natural disasters, political instability, disease outbreaks or global economic downturns — can instantly devastate the livelihoods of workers who have no alternative income sources. Source D notes that in some developing countries, leakages can wipe out most economic benefits, meaning communities face environmental degradation and social disruption without accumulating the reserves needed to withstand tourism shocks. (1 mark) The COVID-19 pandemic demonstrated this vulnerability on a global scale — Thailand's tourist arrivals fell from 39.8 million in 2019 to just 6.7 million in 2020, threatening the livelihoods of the 18% of the Thai workforce employed in tourism. Countries that had diversified their economies — like France, where tourism contributes only ~7% of GDP — were far more resilient to this shock, demonstrating why economic overdependence on tourism is a significant negative impact that policy-makers must actively manage. (1 mark)", "lo": false}, {"id": "Q2.2.j", "ao": "AO2", "marks": 5, "cmd": "Explain", "text": "Using Source E and your own knowledge, explain how overdependence on tourism makes destination regions vulnerable to unexpected events, and assess whether this vulnerability is manageable.", "src": {"t": "note", "lbl": "Source E", "cap": "Model Answer:", "text": "See companion HTML file for source data."}, "ans": "Source E shows three distinct types of unexpected events that can trigger sudden collapses in tourist arrivals and devastating economic consequences. The Caribbean hurricanes (2017) destroyed ~95% of buildings on the worst-affected islands and caused revenue losses of over US$700 million — demonstrating how natural disasters can simultaneously destroy tourism infrastructure and deter tourist arrivals, creating a double economic shock for communities that depend almost entirely on tourism income. (1 mark) The COVID-19 impact on Thailand shown in Source E — arrivals falling from 39.8 million to 6.7 million (-83%) and receipts from US$60 billion to ~US$10 billion — demonstrates the extreme vulnerability that results from deep tourism dependence. Thailand's 18% tourism-dependent workforce faced immediate income loss, and the government had to deploy massive financial support programmes. The severity of the impact directly reflects the degree of overdependence — countries with more diversified economies were better placed to absorb the same shock. (1 mark) Source E also shows that political instability — as demonstrated by Egypt's Arab Spring (2011) causing a 33% fall in arrivals — creates tourism vulnerability of a different character: unlike natural disasters, political instability can persist for years, making tourist-dependent economies extremely difficult to manage. Tourists are highly sensitive to perceived safety risks, and destination regions with poor political stability records may take many years to rebuild tourist confidence even after peace is restored. (1 mark) Source E's comparison across all three cases demonstrates that vulnerability is manageable through economic diversification — destinations that have diversified beyond tourism are less severely affected by the same external shocks. Countries like Singapore, France and Germany have kept tourism's share of GDP relatively low (~4-7%) by maintaining strong manufacturing, financial and trade sectors, making tourism downturns an economic inconvenience rather than a crisis. (1 mark) However, Source E implies that vulnerability is only partially manageable for the most tourism-dependent small island destinations. The Maldives and Caribbean island states have extremely limited land area, natural resources and economic alternatives — their geography makes diversification genuinely difficult. For these destinations, vulnerability management requires a dual approach: both reducing leakage so more tourism revenue is retained for emergency reserves, and developing premium, high-value tourism that generates more revenue from fewer visitors while reducing environmental and social carrying capacity pressures. (1 mark)", "lo": false}, {"id": "Q2.2.k", "ao": "AO2", "marks": 3, "cmd": "Explain", "text": "Using Source F and your own knowledge, explain the positive social impacts of tourism on destination regions.", "src": {"t": "note", "lbl": "Source F", "cap": "Model Answer:", "text": "See companion HTML file for source data."}, "ans": "Source F shows that tourism revenue can provide powerful incentives for the preservation of traditional cultural practices that might otherwise decline. In China, tourist interest in shadow puppetry encouraged communities to innovate — introducing VR technology to attract younger audiences — thereby revitalising an ancient art form that carries historical and cultural significance. Without tourism demand, there would be less financial incentive for communities to maintain and develop these traditions, and cultural knowledge would risk being lost between generations. (1 mark) Source F also demonstrates how tourism can enhance cultural ecosystem services — the benefits that people derive from their relationship with natural and cultural environments. The Sanjiangyuan National Park community-based tourism programme provides aesthetic, educational, recreational and spiritual benefits to both tourists and local residents. By creating economic value for the snow leopard habitat, tourism gives Buddhist villagers an additional economic incentive to protect the sacred mountains and wildlife they already value spiritually — aligning economic and cultural motivations for conservation. (1 mark) The community-based tourism model described in Source F — where tourists stay with local families and directly engage with local life — represents an approach to tourism that maximises positive social impacts by ensuring authentic cultural exchange rather than superficial tourist-local interaction. When tourists have meaningful, respectful engagement with local communities, both parties benefit: tourists gain genuine cultural understanding, while locals gain income and pride in their culture. (1 mark)", "lo": false}, {"id": "Q2.2.m", "ao": "AO2", "marks": 4, "cmd": "Explain", "text": "Using Source H and your own knowledge, explain both the positive and negative environmental impacts of tourism using the Great Barrier Reef as a case study.", "src": {"t": "note", "lbl": "Source H", "cap": "Model Answer:", "text": "See companion HTML file for source data."}, "ans": "Source H shows that tourism generates significant negative environmental impacts on the Great Barrier Reef. Tourist boat engines release carbon dioxide and pollutants; swimmer sunscreen chemicals damage coral; tourist vessel waste enters the marine environment; and the physical disturbance from 2 million annual snorkellers and divers damages coral structures. These impacts have contributed to the reef's severe coral bleaching events, with coral cover dropping to approximately 30% of 1960s levels. (1 mark) The negative environmental impacts described in Source H represent a fundamental paradox of tourism — the natural environment that attracts tourists is simultaneously damaged by their presence. This is a direct manifestation of the stagnation phase of the Tourist Area Cycle, where tourist numbers exceed the destination's carrying capacity, generating negative environmental impacts that threaten the very attractions that drew tourists. (1 mark) However, Source H also demonstrates that tourism generates significant positive environmental impacts — the A$6.4 billion in annual tourism revenue has provided both the financial incentive and the funding needed to establish and maintain the Great Barrier Reef Marine Park since 1975. Without tourism generating economic value from the reef, there would be far less political and financial motivation to fund the hundreds of rangers, scientists and environmental education programmes that the Marine Park employs for reef protection. (1 mark) Source H's environmental education programmes represent a particularly important positive impact — by raising tourist awareness of threats to the reef, tourism creates an informed global community of reef advocates who generate political pressure for stronger environmental protection. This demonstrates how well-managed tourism can simultaneously use and protect natural environments, converting tourist experiences into conservation support through education. (1 mark)", "lo": false}, {"id": "Q2.2.o", "ao": "AO2", "marks": 5, "cmd": "Explain", "text": "Using Source J and your own knowledge, explain how tourism can both degrade and restore natural environments, and assess whether tourism revenue is sufficient to fund effective environmental restoration.", "src": {"t": "note", "lbl": "Source J", "cap": "Model Answer:", "text": "See companion HTML file for source data."}, "ans": "Source J demonstrates through the Singapore River case that environmental degradation can be reversed through sustained investment and political commitment. The river had been so severely degraded by industrial and agricultural pollution that it could no longer support aquatic life. The S$300 million clean-up over a decade transformed it into a vibrant tourism and cultural asset — Clarke Quay — showing that degraded environments can be successfully restored if sufficient financial and political resources are committed. (1 mark) Source J also shows that environmental restoration can create entirely new tourism attractions, generating revenues that justify and sustain the investment. The Singapore River transformation generated ongoing tourism revenue through restaurants, bars and entertainment venues — demonstrating that environmental restoration can be an economically rational investment rather than purely a cost. (1 mark) The Philippines dive sanctuary example in Source J shows that even without government action, private sector actors can initiate environmental restoration when they recognise that their long-term economic interests depend on maintaining the natural environment. The entrance fee funding model creates a direct financial link between tourist visits and reef restoration, aligning economic incentives with environmental outcomes. (1 mark) However, Source J also illustrates important limitations of tourism revenue as a restoration funding mechanism. The Singapore River required S$300 million and the resettlement of over 5,000 businesses and families — a scale of investment and social disruption that only a well-funded government with strong political authority could coordinate. In most developing tourism destinations, this level of government-led intervention is not feasible. (1 mark) An additional limitation is that tourism revenue itself is the product of the very activities that cause environmental degradation — aviation emissions, tourist footfall, accommodation construction. Using tourism revenue to fund environmental restoration creates a circular problem. True environmental sustainability requires not just restoration funding but fundamental changes in the scale and nature of tourism — reducing visitor numbers below carrying capacity, shifting to low-carbon transport and accommodation, and ensuring that ecosystem services on which tourism depends are genuinely protected rather than merely partially restored. (1 mark)", "lo": false}, {"id": "Q2.2.p", "ao": "AO3", "marks": 6, "cmd": "Evaluate", "text": "Using Source K and your own knowledge, to what extent do you agree that tourism is an effective engine of economic development for destination regions? Explain your answer.", "src": {"t": "note", "lbl": "Source K", "cap": "Model Answer (Level 3 — 5-6 marks):", "text": "See companion HTML file for source data."}, "ans": "Model Answer (Level 3 — 5-6 marks): Agree — tourism can generate significant development benefits: Source K correctly identifies tourism's genuine development potential — it is labour-intensive, requires relatively low capital investment compared to manufacturing, and can generate employment and foreign exchange even for countries with limited industrial infrastructure. The Maldives transformed from one of the world's poorest countries in the 1980s to a middle-income economy today through tourism, with revenues funding healthcare, education and infrastructure. In 2019, tourism supported 330 million global jobs — 10% of the workforce — and contributed ~10% of global GDP. For small island developing states with no oil, minerals or manufacturing capacity, tourism is often the only realistic economic development pathway. Partially disagree — leakage severely limits tourism's development impact: However, Source K's critique is powerfully supported by evidence. The UNEP statistic that only US$5 of every US$100 spent by a tourist in a developing country remains in the local host community reveals that mass tourism frequently functions as Source K describes: a 'pipeline' channelling wealth through foreign-owned businesses to foreign shareholders. This means that destination communities bear the environmental costs and social disruption of tourism while receiving only a fraction of the financial benefits. True economic development requires that communities accumulate wealth, improve infrastructure and raise living standards — outcomes that high leakage rates systematically undermine. Conclusion: On balance, I agree that tourism has genuine development potential, but only when the conditions identified in Source K are deliberately created: local ownership, local employment and local sourcing of goods and services. Tourism without these policies functions as an extractive industry rather than a development engine.", "lo": true}, {"id": "Q2.2.r", "ao": "AO3", "marks": 9, "cmd": "Evaluate", "text": "\"The economic impacts of tourism on destination regions are more significant than the social and environmental impacts.\" To what extent do you agree with this statement? Explain your answer.", "src": null, "ans": "Model Answer (Level 3 — 7-9 marks): Agree — economic impacts are immediately visible and large-scale: The economic impacts of tourism are undeniably significant and, in many destination regions, fundamental to national development. Tourism contributed approximately 10% of global GDP and supported 330 million jobs in 2019. For tourism-dependent economies like the Maldives (tourism ~28% of GDP) and Thailand (~20% of GDP), tourism is the primary engine of economic activity — funding government revenues, infrastructure investment and household income for millions of families. The economic impact of COVID-19 on tourism destinations — Thailand losing ~US$50 billion in receipts and having 18% of its workforce threatened — demonstrates the centrality of tourism to destination economies. Disagree — social impacts can be equally severe and longer-lasting: However, the social impacts of tourism can be equally significant — particularly because many are irreversible. Once cultural practices become commodified and lose their authenticity — as with the Balinese Kecak fire dance performed on demand multiple times daily — the spiritual and communal meaning that made them valuable cannot be easily restored. Cultural clashes that create hostility between local communities and tourists fundamentally alter the social fabric of destination communities, creating lasting divisions and resentments. The rise in crime associated with mass tourism has long-lasting consequences for community safety, social trust and destination reputation. Disagree — environmental impacts can be permanent and existential: The environmental impacts of tourism may be the most significant of all in the long run, because they threaten the very natural capital on which all three types of impact depend. The degradation of the Great Barrier Reef represents a potential irreversible loss of one of the world's greatest natural ecosystems. Once coral reef ecosystems collapse, the economic tourism income they generate, the cultural ecosystem services they provide and the regulatory ecosystem services they offer are all simultaneously lost. Deforestation for hotel construction and mangrove clearance for resort development are similarly irreversible on human timescales. Nuanced evaluation — all three are interconnected and mutually reinforcing: The statement's implicit hierarchy — economic > social > environmental — misrepresents the way these impacts interact. Economic impacts depend on social stability (cultural preservation attracts tourists; crime reduces destination appeal) and environmental health (pristine natural environments are primary attractions). Social impacts are shaped by economic conditions (poverty-driven crime; wealth inequality between tourists and locals). Environmental impacts are generated by economic activity and shape the social and cultural life of communities. The three dimensions are inseparable in practice. Conclusion: On balance, I disagree that economic impacts are always more significant than social and environmental impacts. While economic impacts are most immediately visible and measurable, the social and environmental impacts of tourism can be equally or more significant — particularly because many are irreversible. The most accurate characterisation is that all three categories are deeply interconnected and equally significant, requiring simultaneous attention rather than prioritising economic impacts at the expense of social and environmental well-being.", "lo": true}, {"id": "Q2.2.s", "ao": "AO3", "marks": 9, "cmd": "Evaluate", "text": "Using Source M and your own knowledge, to what extent do you agree that the negative social and environmental impacts of tourism on local communities outweigh the economic benefits? Explain your answer.", "src": {"t": "note", "lbl": "Source M", "cap": "Model Answer (Level 3 — 7-9 marks):", "text": "See companion HTML file for source data."}, "ans": "Model Answer (Level 3 — 7-9 marks): Agree — Source M powerfully articulates genuine losses: The community leader in Source M articulates a perspective that is too often absent from economic analyses of tourism — the lived experience of communities whose cultures, environments and ways of life have been transformed without their consent. The transformation of a traditional spiritual festival into a tourist performance represents cultural commodification at its most damaging: the festival is 'now held for the tourists, not for us,' meaning the community has lost the primary function — communal spiritual renewal — that made the festival meaningful. Similarly, children speaking 'more English than our own language' reflects linguistic erosion driven by the economic necessity of communicating with tourists — a loss of cultural heritage that is difficult to reverse once intergenerational transmission is broken. Agree — environmental losses can be permanent and community-defining: Source M's reference to 'the reef that our grandparents dived, that fed our families for generations, is half gone' represents perhaps the most serious impact: the permanent loss of a natural provisioning and regulating ecosystem service that sustained community livelihoods and cultural identity over multiple generations. When the natural environment that defines a community's cultural identity, food security and economic foundation is permanently degraded, the loss extends far beyond any economic benefit that tourism has delivered. Partially disagree — economic benefits are real and meaningful: However, it would be inaccurate to dismiss the economic benefits identified even in Source M — 'our young people have jobs and we have a new clinic.' For many communities in tourism destination regions, particularly those in developing countries with limited economic alternatives, tourism employment represents genuine poverty reduction and access to healthcare and education that would otherwise be unavailable. Nuanced evaluation — the balance depends on agency and distribution: Source M's most powerful insight is captured in the phrase 'we did not invite the hotels.' The negative impacts described are most severe precisely because the community was not a decision-making agent in its own tourism development — tourism arrived and transformed the village without genuine community consultation or control. When communities have genuine agency over tourism development — as in community-based tourism programmes like Angsai village's snow leopard tourism — they can design tourism that aligns with their values, preserves their culture and protects their environment while generating economic benefits. Conclusion: On balance, Source M makes a compelling case that in communities where tourism arrived without genuine community agency and has generated high leakage rates, destroyed natural environments and commodified cultural practices, the negative social and environmental impacts do outweigh economic benefits — particularly when seen from the perspective of future generations. However, I do not agree that this is universally true: tourism that is community-designed, locally owned, environmentally managed and culturally sensitive can generate positive outcomes simultaneously. The critical variable is not tourism itself but the governance and agency conditions under which it develops.", "lo": true}, {"id": "Q2.2.t", "ao": "AO3", "marks": 6, "cmd": "Evaluate", "text": "\"Globalisation has brought more benefits than costs to international tourism.\" To what extent do you agree with this statement? Explain your answer.", "src": null, "ans": "Model Answer (Level 3 — 5-6 marks): Agree — globalisation has dramatically expanded tourism opportunities and accessibility: Globalisation has unambiguously expanded international tourism by increasing the ability, mobility and motivation of hundreds of millions of people to travel. The global middle class grew from 0.6 billion in 1970 to 4.1 billion in 2022, with billions of new potential tourists in China, India and Southeast Asia gaining the financial ability to travel internationally. Globalisation's digital dimension — the growth of online booking platforms, social media and travel review sites — has made tourism planning and booking dramatically cheaper and easier, democratising access to a far wider range of destinations and experiences. Tourism generating and destination regions have become far more diverse, creating development opportunities for previously overlooked destinations in Asia, Africa and the Middle East. Partially disagree — globalisation has intensified negative tourism impacts: However, globalisation has also intensified the negative impacts of tourism by accelerating the speed and scale at which destinations are discovered and overwhelmed. Before globalisation, the progression of a destination through Butler's Tourist Area Cycle took decades — giving communities time to adapt and manage change. Social media and viral digital content have compressed this to years, as Iceland's transformation from 489,000 to 2.3 million visitors between 2010 and 2018 demonstrates. Globalisation has also enabled large multinational hotel chains and tour operators to dominate destination economies, increasing economic leakage and reducing local community economic participation. Conclusion: On balance, I agree that globalisation has brought more benefits than costs to international tourism — it has created enormous economic opportunities, enabled unprecedented human connection across cultures and democratised access to travel experiences. However, these benefits are most evident when tourism revenues reach local communities rather than leaking to foreign shareholders, and when destinations have the institutional capacity to manage the speed and scale of tourist arrivals that globalisation enables.", "lo": true}], "2.3": [{"id": "Q2.3.a", "ao": "AO1", "marks": 1, "cmd": "Define", "text": "What is meant by \"sustainable tourism development\"?", "src": null, "ans": "Sustainable tourism development is achieved when sustainability principles are applied to the economic, social and environmental aspects of tourism development, with all three dimensions balanced to guarantee tourism's long-term viability for present and future generations. (1 mark)", "lo": false}, {"id": "Q2.3.b", "ao": "AO1", "marks": 1, "cmd": "State", "text": "State the difference between \"ecotourism\" and \"community-based tourism.\"", "src": null, "ans": "Ecotourism is a form of sustainable tourism that takes place in natural areas, aimed at conserving the natural environment while benefiting the local community, whereas community-based tourism is an innovative small-scale tourism managed and owned by local communities — such as homestays and agricultural tourism — that seeks to increase people's involvement and ownership of tourism at the destination. (1 mark)", "lo": false}, {"id": "Q2.3.c", "ao": "AO1", "marks": 2, "cmd": "State", "text": "State two ways in which governments can influence sustainable tourism development.", "src": null, "ans": "Governments establish policies, create plans and enforce regulations to manage tourism development — for example, setting visitor quotas, zoning protected natural areas and regulating the construction of tourist facilities. (1 mark) Governments can invest tourism revenues in social services such as schools and clinics that raise standards of living among local communities, ensuring that tourism contributes to economic sustainability. (1 mark)", "lo": false}, {"id": "Q2.3.d", "ao": "AO1", "marks": 2, "cmd": "Identify", "text": "Identify two limitations of pro-poor tourism (PPT) as an approach to sustainable tourism development.", "src": null, "ans": "PPT may be unable to significantly reduce poverty compared to direct investment in social services — tourism income is irregular and seasonal, whereas healthcare and education investments provide more consistent poverty-reducing benefits. (1 mark) The economic benefits of PPT may be highly unevenly distributed, with most benefits flowing to non-poor locals with existing skills, assets or business connections rather than to the poorest community members that PPT aims to help. (1 mark)", "lo": false}, {"id": "Q2.3.e", "ao": "AO1", "marks": 3, "cmd": "State", "text": "State three conditions required for sustainable tourism production.", "src": null, "ans": "The demands placed on ecosystem services by tourism must not exceed the supply of natural resources available — for example, tourist water usage must not deplete freshwater supplies that local communities and agriculture also depend on. (1 mark) Different stakeholders must adopt a long-term, responsible and coordinated approach to tourism development instead of prioritising short-term profits that deplete natural or cultural assets. (1 mark) Tourism development should maintain essential ecological processes and conserve natural heritage and biodiversity, ensuring that the natural environments that attract tourists are preserved for future generations. (1 mark)", "lo": false}, {"id": "Q2.3.g", "ao": "AO2", "marks": 4, "cmd": "Explain", "text": "Using Source B and your own knowledge, explain how sustainable tourism production can be achieved and what happens when it fails.", "src": {"t": "note", "lbl": "Source B", "cap": "Model Answer:", "text": "See companion HTML file for source data."}, "ans": "Source B describes Sentosa Island, Singapore as an example of sustainable tourism production being achieved through a coordinated, multi-stakeholder approach — authorities, businesses and local communities working together towards long-term goals including carbon-neutral status and locally-sourced produce. This reflects the principle that sustainable tourism production requires different stakeholders to adopt a long-term, responsible and coordinated approach instead of prioritising short-term profit. (1 mark) The Bali example in Source B demonstrates what happens when sustainable tourism production fails — the proliferation of hotels and resorts creates such high water demand that it depletes the water supply available for rice farming. This is a direct example of tourism demands on ecosystem services exceeding the supply of resources available, compromising both agricultural and tourism sustainability. (1 mark) Source B's Bali water example illustrates the interconnectedness of sustainability dimensions — the depletion of water (environmental impact) damages the rice farming landscapes that are themselves tourist attractions (economic impact), while the rice farming communities that depend on water lose income (social impact). This cascade demonstrates that when one dimension of sustainability is compromised, the others inevitably follow — reinforcing why all three must be balanced simultaneously. (1 mark) The contrast between Sentosa and Bali in Source B highlights the critical importance of stakeholder coordination and governance. Sentosa's success is directly attributed to authorities bringing together different stakeholders and developing long-term plans — a deliberate governance intervention that creates shared accountability. Bali's water depletion reflects the absence of such coordination — when hotels individually maximise their own water use without coordinated demand management, the collective impact exceeds what the ecosystem can sustainably supply. (1 mark)", "lo": false}, {"id": "Q2.3.i", "ao": "AO2", "marks": 5, "cmd": "Explain", "text": "Using Source D and your own knowledge, explain why stakeholders frequently have conflicting priorities in sustainable tourism development and assess how these conflicts can be managed.", "src": {"t": "note", "lbl": "Source D", "cap": "Model Answer:", "text": "See companion HTML file for source data."}, "ans": "Source D identifies the fundamental governance challenge at the heart of sustainable tourism — each category of stakeholder has profoundly different motivations and definitions of success. A national government prioritising GDP growth may approve large resort developments that generate tax revenue while destroying natural environments. A hotel chain prioritising occupancy rates has no financial incentive to limit visitor numbers. A local fishing community has every incentive to protect the marine environment on which their livelihoods depend. These are not merely differences of opinion — they reflect genuinely incompatible short-term interests that make voluntary coordination extremely difficult. (1 mark) Source D's highway example perfectly illustrates how well-intentioned stakeholder actions can undermine sustainability. A government infrastructure investment designed to improve tourist access can simultaneously destroy the natural landscape that attracted tourists, reducing the long-term tourism appeal of the destination while generating short-term economic benefits from construction contracts. This demonstrates how sustainability failures often arise not from malicious intent but from fragmented decision-making where individual stakeholders optimise for their own interests without accounting for system-wide impacts. (1 mark) The hotel chain example in Source D — importing all food and staff to maximise quality — illustrates how business efficiency goals conflict with community economic sustainability. From the hotel's perspective, importing superior food and trained staff maximises guest satisfaction. From the local community's perspective, this generates high leakage that removes most economic benefit before it reaches local households. Both perspectives are internally rational, but they produce outcomes that undermine sustainable tourism's equitable benefit distribution goals. (1 mark) Source D concludes that resolving these conflicts requires genuine compromise — stakeholders must sacrifice some individual priorities for collective long-term sustainability. In practice, this means governance mechanisms that create accountability: regulations requiring hotels to source a percentage of food locally; tourist arrival caps enforced by government; UNESCO designations creating international scrutiny; community representation in tourism planning. Singapore's Sentosa model — where authorities actively bring together businesses, government agencies and local communities — represents this governance approach in practice. (1 mark) However, when stakeholders have differing amounts of control over resources, those with greater economic power — particularly large multinational tourism corporations — can often out-lobby or out-manoeuvre government regulations and community interests. Truly effective stakeholder management therefore requires not just coordination mechanisms but a deliberate redistribution of power — giving local communities genuine decision-making authority over tourism development in their regions, rather than simply consulting them as one voice among many. (1 mark)", "lo": false}, {"id": "Q2.3.j", "ao": "AO2", "marks": 4, "cmd": "Explain", "text": "Using Source E and your own knowledge, explain the \"attitude-behaviour gap\" in sustainable tourism consumption and what it means for efforts to achieve sus
